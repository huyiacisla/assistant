<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>EasySpot Applicator</title>
<meta name="description" content="Open, add and manage access to your EasySpot apps in one place.">
<script>(function(){var t=null;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ea-web-theme')}catch(e){}if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';var c=document.documentElement.classList;c.remove('light','dark');c.add(t)})()</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:14px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-6:24px;--s-8:32px;
  --lift-xs:0 1px 2px rgba(15,23,42,.035);
  --lift-sm:0 8px 20px rgba(15,23,42,.06);
  --lift-md:0 12px 32px rgba(15,23,42,.14);
  --lift-lg:0 18px 44px rgba(15,23,42,.16);
  --lift-xl:0 24px 70px rgba(15,23,42,.24);
  --sidebar-w:252px;--header-h:56px;
}
:root,.light{
  color-scheme:light;
  --bg:#F3F6FA;--card:#FFFFFF;--muted:#EEF2F7;--muted-2:#E9EDF1;--border:#E1E8F2;--border-strong:#CBD5E1;
  --fg:#16243D;--fg-2:#334155;--fg-muted:#5B6B82;--fg-subtle:#8492A6;
  --ring:#2563EB;--overlay:rgba(15,23,42,.45);
  --success:#007C46;--success-bg:#EDF9F1;--success-dot:#16A34A;
  --warning:#A46104;--warning-bg:#FFF6E7;--warning-dot:#F59E0B;
  --danger:#C24534;--danger-bg:#FFF1EE;--danger-dot:#EF4444;--danger-solid:#C2321F;
  --info:#2E5FA5;--info-bg:#DDEAFA;--info-dot:#3B82F6;
  --neutral:#475569;--neutral-bg:#EEF2F7;
  --grid:#E8EDF4;--card-ring:rgba(22,36,61,.06);
  --hub:#16243D;--hub-fg:#FFFFFF;--hub-t:#16243D;--hub-soft:#EAEFF6;--hub-side:#26385C;
  --ops:#2B55F2;--ops-fg:#FFFFFF;--ops-t:#2B55F2;--ops-soft:#EDF2FF;--ops-side:#2B55F2;
  --home:#0F766E;--home-fg:#FFFFFF;--home-t:#0F766E;--home-soft:#E3F5F1;--home-side:#0F766E;
  --fin:#7C3AED;--fin-fg:#FFFFFF;--fin-t:#7C3AED;--fin-soft:#F2ECFF;--fin-side:#7C3AED;
  --evt:#DB2777;--evt-fg:#FFFFFF;--evt-t:#BE185D;--evt-soft:#FCE7F3;--evt-side:#DB2777;
  --cli:#B45309;--cli-fg:#FFFFFF;--cli-t:#B45309;--cli-soft:#FEF3E2;--cli-side:#B45309;
}
.dark{
  color-scheme:dark;
  --bg:#0A0F1C;--card:#111827;--muted:#182134;--muted-2:#1E293B;--border:#233047;--border-strong:#33425C;
  --fg:#E6EBF3;--fg-2:#C9D3E1;--fg-muted:#94A3B8;--fg-subtle:#6B7A90;
  --ring:#7C9BFF;--overlay:rgba(2,6,23,.65);
  --success:#4ADE80;--success-bg:rgba(34,197,94,.13);--success-dot:#22C55E;
  --warning:#FBBF24;--warning-bg:rgba(245,158,11,.14);--warning-dot:#F59E0B;
  --danger:#F87171;--danger-bg:rgba(239,68,68,.14);--danger-dot:#EF4444;--danger-solid:#DC2626;
  --info:#7DB3FF;--info-bg:rgba(59,130,246,.15);--info-dot:#60A5FA;
  --neutral:#A7B4C6;--neutral-bg:rgba(148,163,184,.12);
  --grid:#1C2639;--card-ring:rgba(255,255,255,.04);
  --lift-xs:0 1px 2px rgba(0,0,0,.3);--lift-sm:0 8px 20px rgba(0,0,0,.35);--lift-md:0 12px 32px rgba(0,0,0,.5);--lift-lg:0 18px 44px rgba(0,0,0,.55);--lift-xl:0 24px 70px rgba(0,0,0,.6);
  --hub:#E6EBF3;--hub-fg:#16243D;--hub-t:#E6EBF3;--hub-soft:rgba(230,235,243,.08);--hub-side:#26385C;
  --ops:#2B55F2;--ops-t:#94AFFF;--ops-soft:rgba(43,85,242,.18);
  --home:#0F766E;--home-t:#2DD4BF;--home-soft:rgba(20,184,166,.15);
  --fin:#7C3AED;--fin-t:#B9A1FF;--fin-soft:rgba(124,58,237,.2);
  --evt:#DB2777;--evt-t:#F9A8D4;--evt-soft:rgba(219,39,119,.18);
  --cli:#B45309;--cli-t:#FCD34D;--cli-soft:rgba(217,119,6,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{display:flex;flex-direction:column;min-height:100vh;font-family:var(--font-sans);font-size:14px;line-height:1.45;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.light{--chip-ok:#006B3C;--chip-ok-bg:#E6F6EC;--chip-new:#1D4E9E;--chip-new-bg:#E2ECFB;--chip-wait:#7A4600;--chip-wait-bg:#FFF2DB;--chip-lock:#475569;--chip-lock-bg:#EEF2F7;--chip-add:#334155;--chip-add-bg:#F3F6FA;--err:#B42318;--sel:#16243D;--sel-fg:#fff}
.dark{--chip-ok:#4ADE80;--chip-ok-bg:#0F2A1C;--chip-new:#93C5FD;--chip-new-bg:#10233F;--chip-wait:#FCD34D;--chip-wait-bg:#2A2109;--chip-lock:#B4C0D0;--chip-lock-bg:#1B2436;--chip-add:#C9D3E1;--chip-add-bg:#172033;--err:#FCA5A5;--sel:#E6EBF3;--sel-fg:#16243D}
.skip{position:absolute;left:8px;top:-100px;z-index:200;background:var(--card);color:var(--fg);padding:12px 16px;border-radius:8px;border:2px solid var(--ring);min-height:44px}
.skip:focus{top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;background:none;color:var(--fg);text-align:center}
.btn-primary{background:var(--sel);color:var(--sel-fg)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-outline{background:var(--card);border-color:var(--border-strong);color:var(--fg)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{color:var(--fg-2)}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:var(--card);border-color:var(--border-strong);color:var(--err)}
.btn-icon{padding:0;width:44px}
.btn:disabled{cursor:not-allowed;background:var(--muted);color:var(--fg-muted);border-color:var(--border)}
.btn-block{width:100%}
.demo-strip{display:flex;align-items:center;gap:8px;padding:6px 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-top:max(6px,env(safe-area-inset-top));background:#2A1F05;color:#FDE68A;font-size:12.5px;border-bottom:1px solid #4A3A10;flex-wrap:wrap}
.demo-strip .lbl{font-weight:700;letter-spacing:.02em}
.demo-strip .grow{flex:1}
.seg{display:inline-flex;padding:3px;gap:3px;border-radius:12px;background:var(--muted);border:1px solid var(--border)}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--fg-2);font-weight:600;cursor:pointer}
.seg button[aria-checked=true]{background:var(--sel);color:var(--sel-fg)}
.demo-strip .seg{background:#3A2C08;border-color:#5A4614}
.demo-strip .seg button{color:#FDE68A}
.demo-strip .seg button[aria-checked=true]{background:#FDE68A;color:#2A1F05}
.demo-strip .btn{color:#FDE68A;border-color:#5A4614}
.demo-strip .btn:hover{background:#3A2C08}
.shell{flex:1;display:grid;grid-template-columns:minmax(0,1fr)}
#app{flex:1;display:flex;flex-direction:column}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:#0E1528;color:#E6EBF3;display:flex;flex-direction:column;z-index:80;transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s;padding-bottom:env(safe-area-inset-bottom)}
.sidebar.open{transform:none;visibility:visible}
.sb-scrim{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:70}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.sb-logo{width:36px;height:36px;border-radius:10px;background:#26385C;display:grid;place-items:center;color:#fff}
.sb-brand b{display:block;font-size:15px}
.sb-brand span{font-size:12px;color:#A9B5C9}
.sb-close{margin-left:auto;color:#E6EBF3}
.sb-ws{margin:8px 12px;padding:10px 12px;border-radius:12px;background:#151E36;border:1px solid #26324D;display:flex;flex-direction:column;gap:6px}
.sb-ws .k{font-size:12px;color:#A9B5C9}
.sb-ws .v{font-size:14px;font-weight:600;color:#F1F5F9}
.sb-ws select{min-height:44px;border-radius:10px;background:#0E1528;color:#F1F5F9;border:1px solid #7A8BA6;padding:0 10px;width:100%}
.sb-nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
.sb-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A9B5C9;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:none;color:#D5DCE8;font-size:14px;cursor:pointer;text-align:left;margin-bottom:8px}
.sb-item:hover{background:#17213B;color:#fff}
.sb-item[aria-current=page]{background:#26385C;color:#fff;font-weight:600}
.sb-item .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#FCD34D;color:#1F1300;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.av{width:36px;height:36px;border-radius:50%;background:#B45309;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.topbar .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.topbar .ttl .sb-logo{width:30px;height:30px;border-radius:8px}
.hdr-search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.hdr-search-ic{position:absolute;left:12px;color:var(--fg-muted);pointer-events:none;display:grid;place-items:center}
#hdrSearch{width:100%;min-width:0;min-height:44px;padding:0 12px 0 38px;border-radius:10px;border:1px solid var(--input-border);background:var(--bg);color:var(--fg);font-size:15px}
#hdrSearch:focus{outline:2px solid var(--ring);outline-offset:1px}
.hdr-search-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:80;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--lift-lg,0 8px 24px rgba(15,23,42,.16));max-height:min(70vh,420px);overflow:auto}
.hdr-search-h{padding:8px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted)}
.hdr-search-opt{padding:8px 12px;min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--fg)}
.hdr-search-opt[aria-selected="true"],.hdr-search-opt:hover{background:var(--muted)}
.hdr-search-empty{padding:14px 12px;color:var(--fg-muted)}
.bell{position:relative}
.bell .dotc{position:absolute;top:6px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#B42318;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.offline{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--chip-wait-bg);color:var(--chip-wait);font-size:13.5px}
main{padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom));outline:none;width:100%;max-width:880px}
h1{margin:0;font-size:22px;line-height:28px;letter-spacing:-.01em}
h2{margin:0;font-size:18px;line-height:24px}
h3{margin:0;font-size:15px}
.sub{margin:4px 0 0;color:var(--fg-muted);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px dashed var(--border-strong);color:var(--fg-muted);font-size:12px;font-weight:600}
.hub-head{display:flex;flex-direction:column;gap:14px;max-width:560px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:12px;color:var(--fg-muted);pointer-events:none}
.search input{width:100%;min-height:44px;padding:0 12px 0 38px;border-radius:10px;border:1px solid var(--input-border);background:var(--card);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:560px;margin-top:16px}
.tile{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--border);color:var(--fg);cursor:pointer;min-width:0;box-shadow:var(--lift-xs);text-align:center}
.tile:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.tile .t-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.tile[data-state=locked] .t-ic,.tile[data-state=request_access] .t-ic,.tile[data-state=available] .t-ic{filter:saturate(.35)}
.tile[data-state=available]{border-style:dashed}
.t-n{font-size:14px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.25}
.c-open{background:var(--chip-ok-bg);color:var(--chip-ok)}
.c-new{background:var(--chip-new-bg);color:var(--chip-new)}
.c-pending{background:var(--chip-wait-bg);color:var(--chip-wait)}
.c-locked{background:var(--chip-lock-bg);color:var(--chip-lock)}
.c-request_access{background:var(--chip-lock-bg);color:var(--chip-lock)}
.c-available{background:var(--chip-add-bg);color:var(--chip-add)}
.t-line{font-size:12px;color:var(--fg-muted);line-height:1.3}
.tile.add{border:1.5px dashed var(--border-strong);background:transparent;color:var(--fg-2)}
.tile.add .t-ic{background:var(--muted);color:var(--fg-2)}
.ic-ops{background:#2B55F2}.ic-home{background:#0F766E}.ic-evt{background:#DB2777}.ic-fin{background:#7C3AED}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 16px;margin-top:16px;border:1px dashed var(--border-strong);border-radius:18px;max-width:560px;background:var(--card)}
.empty .e-ic{width:56px;height:56px;border-radius:16px;background:var(--muted);display:grid;place-items:center;color:var(--fg-2)}
.empty p{margin:0;color:var(--fg-2);max-width:360px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--muted);color:var(--fg-2);font-size:13.5px;margin-top:14px;max-width:560px}
.note .ic{margin-top:2px}
.skel{aspect-ratio:1/1;border-radius:18px;background:var(--muted);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.6}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.sidebar{transition:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .grow{flex:1;min-width:160px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.mini-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.muted{color:var(--fg-muted)}
.small{font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-top:14px;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 12px;border:0;background:none;color:var(--fg-muted);font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--chip-wait-bg);color:var(--chip-wait);font-size:12px;display:inline-grid;place-items:center}
.sw{display:inline-flex;align-items:center;gap:10px;text-align:left;min-height:44px;min-width:44px;padding:0 6px;border:0;background:none;cursor:pointer;color:var(--fg)}
.sw .trk{position:relative;width:40px;height:24px;border-radius:999px;background:var(--input-border);flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] .trk{background:#007C46}
.sw[aria-checked=true] .trk::after{transform:translateX(16px)}
.sw:disabled{cursor:not-allowed;color:var(--fg-muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.field label{font-size:13px;font-weight:600;color:var(--fg-2)}
.field input,.field select,.field textarea{min-height:44px;width:100%;border:1px solid var(--input-border);background:var(--card);border-radius:10px;padding:8px 12px;font-size:15px}
.field textarea{min-height:96px;resize:vertical}
.field .help{font-size:12.5px;color:var(--fg-muted)}
.field .err{font-size:13px;color:var(--err);display:flex;gap:6px;align-items:flex-start}
.field .is-err{border-color:var(--err);border-width:2px}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.dialog{position:relative;width:100%;max-height:calc(100vh - 24px);overflow:auto;background:var(--card);color:var(--fg);border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:var(--lift-xl);border:1px solid var(--border)}
.dialog .x{position:absolute;top:8px;right:8px}
.dialog h2{padding-right:44px}
.dialog .lead{margin:6px 0 0;color:var(--fg-2)}
.am-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.am-top h2{padding:0}
.am-ic{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;color:#fff}
.am-desc{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--border);color:var(--fg-2)}
.acts-col{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.why{font-size:13px;color:var(--fg-2);display:flex;gap:6px;align-items:center;justify-content:center}
.msg-err{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--chip-wait-bg);color:var(--chip-wait);margin-top:12px;font-size:14px}
.cat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cat-opt{display:flex;gap:12px;align-items:center;padding:10px 12px;min-height:64px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer;text-align:left;width:100%}
.cat-opt[aria-checked=true]{border:2px solid var(--fg)}
.cat-opt:disabled{cursor:not-allowed;background:var(--muted)}
.cat-opt .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-opt .grow span{font-size:13px;color:var(--fg-muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.full{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 16px;max-width:520px;margin:0 auto}
.full .e-ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;color:#fff;background:#475569}
.full p{margin:0;color:var(--fg-2)}
.app-head{display:flex;align-items:center;gap:12px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

<script>
/* Hub Context Contract v1.
   The one file a child app needs. No dependencies; safe to load in the Hub and in any app.
   Hub side:   HubContract.build(launch, ctx)      -> launch URL carrying the context
               HubContract.parseReturn(hash)       -> what the app said when it came back
   App side:   HubContract.read(location.search)   -> {ok, ctx, errors}
               HubContract.backUrl(ctx, info)      -> where "Back to Hub" goes
               HubContract.notifyHub(ctx, note)    -> put a line under the Hub bell
               HubContract.signedOut(userId)       -> true once the Hub signed the user out */
(function(root){
 const VERSION=1;
 const FIELDS=['app','companyId','company','propertyId','propertyKey','property','role','userId','user','theme','locale','dateFormat','timeZone','returnUrl'];
 const REQUIRED=['app','companyId','role','userId','returnUrl'];
 const RETURN_MARK='#hub-return=';
 const CHANNEL='ea-store';

 /* Only ever go back to a page on this origin: no open redirects, no script URLs. */
 function safeUrl(u,base,hubOrigins){
  try{
   const here=new URL(base||root.location.href),x=new URL(String(u),here);
   if(!/^(https?|file):$/.test(x.protocol))return null;
   if(x.protocol===here.protocol&&x.host===here.host)return x.href;
   /* An app on another site lists the Hub origins it trusts, e.g. ['https://hub.example.com']. */
   return x.protocol==='https:'&&Array.isArray(hubOrigins)&&hubOrigins.indexOf(x.origin)>=0?x.href:null;
  }catch(e){return null}
 }

 function build(launch,ctx,base){
  const u=new URL(launch.url,base||root.location.href);
  u.searchParams.set('hub',String(VERSION));
  (launch.params||FIELDS).forEach(k=>{if(ctx[k]!=null&&ctx[k]!=='')u.searchParams.set(k,String(ctx[k]))});
  return u.href;
 }

 function read(search,opts){
  const o=opts||{},q=new URLSearchParams(search==null?root.location.search:search),ctx={},errors=[];
  if(q.get('hub')!==String(VERSION))errors.push('hub');
  FIELDS.forEach(k=>{const v=q.get(k);if(v!=null&&v!=='')ctx[k]=v});
  REQUIRED.concat(o.require||[]).forEach(k=>{if(!ctx[k])errors.push(k)});
  if(ctx.returnUrl){const s=safeUrl(ctx.returnUrl,o.base,o.hubOrigins);if(s)ctx.returnUrl=s;else{delete ctx.returnUrl;if(errors.indexOf('returnUrl')<0)errors.push('returnUrl')}}
  if(ctx.theme!=='dark'&&ctx.theme!=='light')delete ctx.theme;
  if(o.app&&ctx.app&&ctx.app!==o.app)errors.push('app');
  return {ok:!errors.length,ctx,errors};
 }

 function backUrl(ctx,info,opts){
  const base=ctx&&ctx.returnUrl?safeUrl(ctx.returnUrl,null,opts&&opts.hubOrigins):null;
  if(!base)return null;
  const payload=Object.assign({app:ctx.app},info||{});
  return base.split('#')[0]+RETURN_MARK+encodeURIComponent(JSON.stringify(payload));
 }

 function parseReturn(hash){
  const h=String(hash==null?root.location.hash:hash);
  if(h.indexOf(RETURN_MARK)!==0)return null;
  try{
   const o=JSON.parse(decodeURIComponent(h.slice(RETURN_MARK.length)));
   if(!o||typeof o!=='object'||typeof o.app!=='string')return null;
   return {app:o.app.slice(0,40),event:typeof o.event==='string'?o.event.slice(0,40):'',message:typeof o.message==='string'?o.message.slice(0,200):''};
  }catch(e){return null}
 }

 /* Notes live in the same store the Hub syncs: ea:notes:<topic>:<sender>. */
 function notifyHub(ctx,note){
  if(!ctx||!ctx.userId||!ctx.app||!note||!note.text)return false;
  const key='ea:notes:'+ctx.userId+':app_'+ctx.app,t=Date.now();
  let items=[];
  try{const cur=JSON.parse(root.localStorage.getItem(key)||'null');if(cur&&cur.v===1&&Array.isArray(cur.items))items=cur.items}catch(e){}
  items=[{id:'app_'+ctx.app+'-'+t,type:note.type||'apps',text:String(note.text).slice(0,200),app:ctx.app}].concat(items).slice(0,20);
  const val={v:1,items,_t:t};
  try{root.localStorage.setItem(key,JSON.stringify(val))}catch(e){return false}
  try{const ch=new BroadcastChannel(CHANNEL);ch.postMessage({from:'app',key,val});ch.close()}catch(e){}
  return true;
 }

 function sessionKey(userId){return 'ea-session:'+userId}
 function signedOut(userId){
  try{const o=JSON.parse(root.localStorage.getItem(sessionKey(userId))||'null');return !!(o&&o.out&&(!o.in||o.out>o.in))}catch(e){return false}
 }
 function markSession(userId,what){
  try{const k=sessionKey(userId),o=JSON.parse(root.localStorage.getItem(k)||'null')||{};o[what]=Date.now();root.localStorage.setItem(k,JSON.stringify(o))}catch(e){}
 }

 root.HubContract={VERSION,FIELDS,REQUIRED,build,read,backUrl,parseReturn,notifyHub,safeUrl,sessionKey,signedOut,markSession};
})(window);
</script>
<script>

   The Hub draws tiles, decides what a tap does and builds the launch URL from this table.
   Adding an app = adding one entry here (plus an icon colour in hub.css). */
const APP_REGISTRY=[
 {id:'ops',slug:'ops',name:'EasySpotOps',shortName:'Ops',category:'Operations',icon:'square-parking',color:'#2B55F2',
  description:'Keep parking fair: permits, guest passes and entries in one place.',
  keywords:'parking permits guest passes entries tow spots',
  highlights:['Guest passes and permits','Entries and open spots','Tow requests'],
  lifecycle:'live',

const APP_KEYS=APP_REGISTRY.map(a=>a.id);

const APPS=APP_REGISTRY.map(a=>({k:a.id,name:a.name,icon:a.icon,desc:a.description}));

/* One vocabulary for every view. */
const LIFECYCLES=['live','beta','coming_soon','maintenance'];
const LIFECYCLE={
 live:{label:'Live'},
 beta:{label:'Beta',chip:'c-new',icon:'sparkles'},
 coming_soon:{label:'Coming soon',chip:'c-pending',icon:'clock'},
 maintenance:{label:'Maintenance',chip:'c-pending',icon:'triangle-alert'}};

 open:{label:'Ready to open',icon:'circle-check'},

 request_access:{label:'No access yet',icon:'key-round'},

const REQ_STATES=['pending','approved','denied','expired'];
const REQ_STATE={
 pending:{chip:'c-pending',icon:'clock',label:'Pending approval',event:'pending'},
 approved:{chip:'c-open',icon:'circle-check',label:'Approved',event:'approved'},

/* System-wide config, owned by EasySpot (admin console). */
const SYS_KEY='ea:sys:config';
const SYS_DEFAULT=()=>({v:1,lifecycle:{},enableTtlDays:14});
function sysConfig(){
 const o=typeof storeGet==='function'?storeGet(SYS_KEY):null,d=SYS_DEFAULT();
 if(!o||o.v!==1)return d;
 if(o.lifecycle&&typeof o.lifecycle==='object')APP_KEYS.forEach(k=>{if(lifecycleChoices(k).includes(o.lifecycle[k]))d.lifecycle[k]=o.lifecycle[k]});
 if([7,14,30].includes(o.enableTtlDays))d.enableTtlDays=o.enableTtlDays;
 return d;
}
/* An app with no destination yet can't be switched to live or beta. */
function lifecycleChoices(id){const a=appDef(id);return a&&a.launch&&a.launch.type!=='modal_preview'?LIFECYCLES.slice():['coming_soon','maintenance']}
/* Where this person's tap lands: the entrance for their role if the app has one, else the default. */
function launchFor(app,userRole){const l=app.launch,u=l.urlByRole&&l.urlByRole[userRole];return u?Object.assign({},l,{url:u}):l}
function appLifecycle(id){const a=appDef(id);if(!a)return 'coming_soon';return sysConfig().lifecycle[id]||a.lifecycle}

/* The one answer to "what can this person do with this app, here, now?"
   c = {role:'client'|'staff', userRole, catalog, ent, grants, reqs, enableReqs, prop, now, viewer} */
function resolveAppState(id,c){
 const app=appDef(id),lc=appLifecycle(id);
 const out=(state,reason,extra)=>{const ready=state==='open'||state==='new';return Object.assign({app:id,state,reason:reason||null,lifecycle:lc,ready,launchable:ready&&(lc==='live'||lc==='beta')},extra||{})};
 const newest=(a,b)=>String(b.id).localeCompare(String(a.id));
 if(!app)return out('locked','unknown');
 if(!(c.catalog&&c.catalog[id])){
  if(c.role==='client'){
   const r=(c.enableReqs||[]).filter(x=>x.app===id).sort(newest)[0],vs=r?reqViewSt(r):null;
   if(vs==='pending')return out('pending','easyspot_review',{req:r});
   if(vs==='denied')return out('locked','easyspot_denied',{req:r});
  }
  return out('locked','not_enabled');
 }
 const e=(c.ent&&c.ent[id])||{st:'none'};
 if(c.role==='client'){
  if(e.st==='active')return out(c.now-e.on<7?'new':'open',null,{since:e.on});
  if(e.st==='pending')return out('pending','company_pending',{ent:e});
  return out('available','not_added');
 }
 if(e.st!=='active')return out('locked','not_on_account');
 if(app.allowedRoles&&c.userRole&&!app.allowedRoles.includes(c.userRole))return out('locked','role_not_allowed');
 const g=(c.grants||[]).find(x=>x.app===id&&x.prop===c.prop);
 if(g)return out(c.now-g.on<7?'new':'open',null,{since:g.on});
 const r=(c.reqs||[]).filter(x=>x.app===id&&x.prop===c.prop).sort(newest)[0],vs=r&&r.st!=='approved'?reqViewSt(r):null;
 if(vs==='pending')return out('pending','request_pending',{req:r});
 return out('request_access',c.viewer?'viewer':vs==='denied'?'request_denied':vs==='expired'?'request_expired':'no_grant',{req:vs?r:null});
}

<script>
/* Settings: one stored object per person, read by the Hub and applied the moment it changes.
   Personal settings  -> localStorage "ea-settings:<userId>" (this device)
   Theme              -> localStorage "ea-web-theme" (light | dark | system), read before first paint
   Organization/System-> the role page owns them (settingsOrgHTML / settingsOrgChange hooks) */
const THEME_KEY='ea-web-theme';
const DATE_FORMATS=[['mdy','Nov 14'],['dmy','14 Nov'],['iso','2026-11-14']];
const TIME_ZONES=[['auto','Automatic (this device)'],['UTC','UTC'],['America/New_York','New York'],['America/Chicago','Chicago'],['America/Los_Angeles','Los Angeles'],['Europe/London','London'],['Asia/Ho_Chi_Minh','Ho Chi Minh City']];
const HUB_VIEWS=[['all','All apps'],['ready','Ready'],['pending','Pending']];
const SESSION_MINUTES=[[15,'15 minutes'],[30,'30 minutes'],[60,'1 hour'],[0,'Never']];
const NOTIF_TYPES=[
 ['req','Access requests','When someone asks for an app, or a request you sent changes'],
 ['appr','Approvals','When an app or request is approved or not'],
 ['apps','App updates','When an app is turned on or off, or its status changes'],
 ['digest','Weekly summary','A short recap every Monday']];
const SETTINGS_SECTIONS=[['appearance','Appearance and defaults','theme dark light density compact default view building'],['region','Language and region','language date format time zone'],['notifications','Notifications','bell email alerts'],['security','Security and session','sign out session timeout'],['org','Organization and system','buildings policy requests availability']];
const SETTINGS_DEFAULT=()=>({v:1,density:'comfortable',defaultView:'all',defaultProp:'last',lastProp:null,lang:'en',dateFormat:'mdy',timeZone:'auto',
 notif:{inapp:{req:true,appr:true,apps:true,digest:false},email:{req:false,appr:false,apps:false,digest:false}},
 sessionMin:30,pins:[],recent:[],notifyReady:{}});
let SETTINGS=SETTINGS_DEFAULT();
let settingsOwner='';
let sessionStart=Date.now(),lastActivity=Date.now();

function settingsKey(){return 'ea-settings:'+settingsOwner}
function settingsClean(o){
 const d=SETTINGS_DEFAULT();
 if(!o||typeof o!=='object'||o.v!==1)return d;
 const pick=(k,list)=>{if(list.includes(o[k]))d[k]=o[k]};
 pick('density',['comfortable','compact']);pick('defaultView',HUB_VIEWS.map(x=>x[0]));pick('lang',['en']);
 pick('dateFormat',DATE_FORMATS.map(x=>x[0]));pick('timeZone',TIME_ZONES.map(x=>x[0]));pick('sessionMin',SESSION_MINUTES.map(x=>x[0]));
 if(typeof o.defaultProp==='string'&&/^[a-z0-9]{1,12}$/.test(o.defaultProp))d.defaultProp=o.defaultProp;
 if(typeof o.lastProp==='string'&&/^[a-z0-9]{1,12}$/.test(o.lastProp))d.lastProp=o.lastProp;
 ['inapp','email'].forEach(ch=>NOTIF_TYPES.forEach(([k])=>{if(o.notif&&o.notif[ch]&&typeof o.notif[ch][k]==='boolean')d.notif[ch][k]=o.notif[ch][k]}));
 const ids=a=>Array.isArray(a)?a.filter((k,i)=>APP_KEYS.includes(k)&&a.indexOf(k)===i):[];
 d.pins=ids(o.pins);d.recent=ids(o.recent).slice(0,4);
 if(o.notifyReady&&typeof o.notifyReady==='object')APP_KEYS.forEach(k=>{if(o.notifyReady[k]===true)d.notifyReady[k]=true});
 return d;
}
function settingsLoad(){let o=null;try{o=JSON.parse(localStorage.getItem(settingsKey())||'null')}catch(e){}SETTINGS=settingsClean(o)}
function settingsSave(patch,quiet){
 Object.assign(SETTINGS,patch||{});
 try{localStorage.setItem(settingsKey(),JSON.stringify(SETTINGS))}catch(e){}
 settingsApply();
 if(!quiet){settingsSaved=true;if(typeof render==='function')render();live('Saved.')}
}
let settingsSaved=false;
function settingsApply(){document.documentElement.classList.toggle('dens-compact',SETTINGS.density==='compact')}

function sysDark(){return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function readThemeMode(){let t=null;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem(THEME_KEY)}catch(e){}return t==='dark'||t==='light'?t:'system'}

/* Dates in this preview are sample days counted from a fixed base, so they are formatted in UTC. */
function fmtDate(dt){
 const f=SETTINGS.dateFormat;
 if(f==='iso')return dt.toISOString().slice(0,10);
 return dt.toLocaleDateString(f==='dmy'?'en-GB':'en-US',{month:'short',day:'numeric',timeZone:'UTC'});
}
function fmtTime(ts){
 const o={hour:'numeric',minute:'2-digit',timeZoneName:'short'};
 if(SETTINGS.timeZone!=='auto')o.timeZone=SETTINGS.timeZone;
 try{return new Date(ts).toLocaleTimeString(SETTINGS.dateFormat==='mdy'?'en-US':'en-GB',o)}catch(e){return new Date(ts).toLocaleTimeString()}
}

function togglePin(k){const on=SETTINGS.pins.includes(k);settingsSave({pins:on?SETTINGS.pins.filter(x=>x!==k):SETTINGS.pins.concat(k)},true);return !on}
function pushRecent(k){settingsSave({recent:[k].concat(SETTINGS.recent.filter(x=>x!==k)).slice(0,4)},true)}
function notifOn(type){const n=SETTINGS.notif.inapp;return n[type]!==false}

function settingsInit(userId){
 settingsOwner=userId;settingsLoad();settingsApply();
 try{const k='ea-session-start:'+userId,v=+sessionStorage.getItem(k);if(v)sessionStart=v;else sessionStorage.setItem(k,String(sessionStart))}catch(e){}
 ['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{lastActivity=Date.now()},true));
 setInterval(sessionTick,5000);
 if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themeMode==='system'){setTheme('system');render()}});
 addEventListener('storage',e=>{if(e.key===settingsKey()){settingsLoad();settingsApply();render()}if(e.key===HubContract.sessionKey(settingsOwner)&&HubContract.signedOut(settingsOwner)&&S.session==='ok'){closeAll();S.session='out';render()}});
}
function sessionTick(now){
 if(S.session!=='ok'||!SETTINGS.sessionMin)return;
 if((now||Date.now())-lastActivity<SETTINGS.sessionMin*6e4)return;
 closeAll();S.session='expired';render();const b=$('#signIn');b&&b.focus();
}

function settingsView(back){
 const s=SETTINGS,hub=typeof hubView==='function';
 const head=(k,t)=>`<h2 class="h3" id="set-${k}" tabindex="-1">${t}</h2>`;
 const seg=(key,label,opts,cur)=>`<div class="set-row"><span class="set-l" id="setl-${key}">${label}</span><div class="seg" role="radiogroup" aria-labelledby="setl-${key}">${opts.map(([v,l])=>`<button type="button" role="radio" data-k="set-${key}-${v}" data-setseg="${key}|${v}" aria-checked="${cur===v}" tabindex="${cur===v?0:-1}">${l}</button>`).join('')}</div></div>`;
 const sel=(key,label,opts,cur,help)=>`<div class="field"><label for="set-f-${key}">${label}</label><select id="set-f-${key}" data-k="set-${key}" data-set="${key}"${help?` aria-describedby="set-h-${key}"`:''}>${opts.map(([v,l,off])=>`<option value="${esc(v)}"${String(cur)===String(v)?' selected':''}${off?' disabled':''}>${esc(l)}</option>`).join('')}</select>${help?`<span class="help" id="set-h-${key}">${help}</span>`:''}</div>`;
 const propOpts=hub?[['last','Last used']].concat(hubPropChoices()):[];
 const u=me();
 const org=typeof settingsOrgHTML==='function'?settingsOrgHTML(head):'';
 return `<div id="settingsView" class="page-narrow">${back||(typeof backBtn==='function'?backBtn():'')}<h1 style="margin-top:12px">Settings</h1>${pageCoSub()}
 <p class="muted set-status" id="setStatus" role="status">${ic(settingsSaved?'circle-check':'info',15)}<span>${settingsSaved?'All changes saved on this device.':'Changes save as you make them. Nothing is sent.'}</span> <span class="sample">Preview</span></p>
 <div class="card">${head('appearance','Appearance and defaults')}
  ${seg('theme','Theme',[['light','Light'],['dark','Dark'],['system','System']],themeMode)}
  ${seg('density','App tiles',[['comfortable','Comfortable'],['compact','Compact']],s.density)}
  ${hub?sel('defaultView','Show first when the Hub opens',HUB_VIEWS,s.defaultView)+sel('defaultProp','Building when you sign in',propOpts,propOpts.some(o=>o[0]===s.defaultProp)?s.defaultProp:'last'):''}</div>
 <div class="card">${head('region','Language and region')}
  ${sel('lang','Display language',[['en','English'],['vi','Tiếng Việt (coming soon)',1],['es','Español (coming soon)',1]],s.lang,'Only English is available in this preview.')}
  ${sel('dateFormat','Date format',DATE_FORMATS,s.dateFormat)}
  ${sel('timeZone','Time zone',TIME_ZONES,s.timeZone,`Now: ${esc(fmtTime(Date.now()))}`)}</div>
 <div class="card">${head('notifications','Notifications')}<p class="small muted" style="margin:4px 0 8px">In app shows under the bell. Email is a preview: nothing is sent.</p>
  <div class="list">${NOTIF_TYPES.map(([k,l,h])=>`<div class="li set-n"><div class="grow"><b style="font-weight:600">${l}</b><span class="small muted" style="display:block">${h}</span></div><div class="set-n-sw">${[['inapp','In app'],['email','Email']].map(([ch,cl])=>`<button type="button" class="sw" role="switch" data-k="ns-${ch}-${k}" data-setsw="${ch}|${k}" aria-checked="${!!s.notif[ch][k]}" aria-label="${l}: ${cl}"><span class="trk"></span><span aria-hidden="true">${cl}</span></button>`).join('')}</div></div>`).join('')}</div></div>
 <div class="card">${head('security','Security and session')}
  <div class="list" style="margin-top:6px"><div class="li"><span class="muted pf-k">Signed in as</span><span class="pf-v" style="overflow-wrap:anywhere">${esc(u.email||u.name)}</span></div><div class="li"><span class="muted pf-k">This session</span><span class="pf-v">Started ${esc(fmtTime(sessionStart))}</span></div></div>
  ${sel('sessionMin','Sign me out when idle for',SESSION_MINUTES,s.sessionMin,'Applies to this Hub on this device.')}
  <div style="margin-top:14px"><button type="button" class="btn btn-outline" id="setSignoutAll" data-k="set-signout-all">${ic('log-out',16)}Sign out of every EasySpot app</button></div></div>
 ${org}
 <div style="margin-top:16px"><button type="button" class="btn btn-outline" id="setReset" data-k="set-reset">${ic('refresh-cw',16)}Reset my settings</button></div></div>`;
}

function settingsClick(t){
 if(t.dataset.setseg){
  const [key,val]=t.dataset.setseg.split('|');
  if(key==='theme'){if(!['light','dark','system'].includes(val))return true;setTheme(val);settingsSaved=true;render();live(val==='system'?'Theme follows this device.':val==='dark'?'Dark mode on.':'Light mode on.')}
  else if(key==='density'&&['comfortable','compact'].includes(val))settingsSave({density:val});
  const b=document.querySelector(`[data-k="set-${key}-${val}"]`);b&&b.focus();return true}
 if(t.dataset.setsw){const [ch,k]=t.dataset.setsw.split('|');if(!SETTINGS.notif[ch]||!(k in SETTINGS.notif[ch]))return true;SETTINGS.notif[ch][k]=!SETTINGS.notif[ch][k];settingsSave();return true}
 if(t.id==='setSignoutAll'){signOut();return true}
 if(t.id==='setReset'){
  const m=openModal('resetModal',`<h2 id="resetModal-t">Reset your settings?</h2><p class="lead">Theme, tiles, defaults, notifications and pinned apps go back to how they started. Your access to apps does not change.</p><div class="acts-col"><button type="button" class="btn btn-primary btn-block" id="rsYes">Reset my settings</button><button type="button" class="btn btn-outline btn-block" data-close>Cancel</button></div>`,{opener:t,focus:'[data-close]'});
  m.querySelector('#rsYes').onclick=()=>{SETTINGS=SETTINGS_DEFAULT();setTheme('system');closeModal({noReturn:true});settingsSave();live('Settings reset.');const b=$('#setReset');b&&b.focus()};
  return true}
 return false;
}
document.addEventListener('change',e=>{
 const t=e.target;if(!t||!t.dataset)return;
 if(t.dataset.set){
  const key=t.dataset.set,v=t.value,lists={defaultView:HUB_VIEWS,dateFormat:DATE_FORMATS,timeZone:TIME_ZONES};
  if(key==='sessionMin'){if(SESSION_MINUTES.some(x=>String(x[0])===v))settingsSave({sessionMin:+v})}
  else if(key==='defaultProp'){if(v==='last'||hubPropChoices().some(x=>x[0]===v))settingsSave({defaultProp:v})}
  else if(key==='lang'){if(v==='en')settingsSave({lang:v})}
  else if(lists[key]&&lists[key].some(x=>x[0]===v))settingsSave({[key]:v});
  return}
 if(t.dataset.setorg&&typeof settingsOrgChange==='function'){settingsOrgChange(t.dataset.setorg,t.value,t);return}
});
function openSettingsSection(key){go('settings');const h=$('#set-'+key);if(h){h.scrollIntoView({block:'start'});h.focus({preventScroll:true})}}
</script>

/* Notifications travel through the shared store: ea:notes:<topic>:<sender>.
   A page reads the topics it belongs to (NOTE_TOPICS) and writes one outbox per topic it talks to. */
function noteFrom(){return storeRole()}

function notify(topic,type,text,extra){
 const key='ea:notes:'+topic+':'+noteFrom(),cur=storeGet(key);
 const items=cur&&cur.v===1&&Array.isArray(cur.items)?cur.items.slice():[];
 items.unshift(Object.assign({id:noteFrom()+'-'+storeNow(),type,text:String(text),day:S.now},extra||{}));
 storeSet(key,{v:1,items:items.slice(0,30)});
}

function notesReadKey(){return 'ea-notes-read:'+me().id}
function notesRead(){try{const a=JSON.parse(localStorage.getItem(notesReadKey())||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function myNotes(){
 const topics=typeof NOTE_TOPICS==='function'?NOTE_TOPICS():[noteSelf()],self=noteSelf(),from=noteFrom(),read=new Set(notesRead()),out=[];
 try{for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);if(!k||k.indexOf('ea:notes:')!==0)continue;
  const p=k.split(':'),topic=p[2],sender=p.slice(3).join(':');
  if(topics.indexOf(topic)<0||(sender===from&&topic!==self))continue;
  const v=storeGet(k);if(!v||v.v!==1||!Array.isArray(v.items))continue;
  v.items.forEach(n=>{if(!n||typeof n.id!=='string'||typeof n.text!=='string')return;
   const type=NOTIF_TYPES.some(x=>x[0]===n.type)?n.type:'apps';
   if(!notifOn(type)&&!(n.app&&n.ready&&SETTINGS.notifyReady[n.app]))return;
   out.push({id:n.id,type,text:n.text,day:typeof n.day==='number'?n.day:S.now,read:read.has(n.id),t:+(n.id.split('-').pop())||0})});
 }}catch(e){}
 return out.sort((a,b)=>b.t-a.t).slice(0,40);
}

function hubLaunchCtx(k,prop){

/* One tap on an app always ends somewhere useful:
   signed out -> sign in · no access -> the flow that gets access · waiting/locked -> why and what next
   not launched yet -> preview + "tell me" · offline -> say so · needs one building -> pick it · else -> open. */
function launchApp(k,opener,opts){
 const app=appDef(k);if(!app||launching)return;
 if(S.session!=='ok'){expireSession();return}
 const s=appSt(k);
 if(s.state==='available'&&typeof addModal==='function'){addModal(k,opener);return}
 if(s.state==='request_access'&&s.reason!=='viewer'&&typeof requestModal==='function'){requestModal(k,opener);return}
 if(!s.launchable){appDetailModal(k,opener);return}
 if(S.offline){launchProblem(k,opener,'offline');return}
 const prop=(opts&&opts.prop)||S.prop;
 if(app.requiresSingleProperty&&(prop==='all'||!P(prop))){propPickModal(k,opener);return}
 beginLaunch(k,opener,prop);
}
function beginLaunch(k,opener,prop){
 const app=appDef(k);launching=k;
 const tile=document.querySelector(`[data-k="tile-${k}"]`);tile&&tile.setAttribute('aria-busy','true');
 live(`Opening ${app.name}…`);
 setTimeout(()=>{
  launching=null;const tl=document.querySelector(`[data-k="tile-${k}"]`);tl&&tl.removeAttribute('aria-busy');
  const f=S.failNext;S.failNext=null;
  if(S.session!=='ok'||f==='session'){expireSession();return}
  if(S.offline||f==='error'){launchProblem(k,opener,S.offline?'offline':'error');return}
  if(f==='noaccess'||!appSt(k).launchable){launchProblem(k,opener,'noaccess');return}
  pushRecent(k);uiSave();
  const url=HubContract.build(launchFor(app,me().role),hubLaunchCtx(k,prop));
  if(app.launch.target==='blank'){const w=window.open(url,'_blank');if(!w){launchProblem(k,opener,'blocked',url);return}try{w.opener=null}catch(e){}render();live(`${app.name} opened in a new tab.`);return}
  location.assign(url);
 },450);
}
function launchProblem(k,opener,why,url){
 const n=appDef(k).name,canAsk=typeof requestModal==='function'&&!(typeof isViewer==='function'&&isViewer());
 const text={offline:`You're offline. ${n} will open when you're back online.`,error:`We couldn't open ${n}. Please try again.`,blocked:`${n} opens in a new tab, and your browser held it back. Use the button below to open it.`,noaccess:`You don't have access to ${n} yet.${canAsk?'':' Ask your account admin to check your access, or contact us from Help.'}`}[why];
 const act=why==='noaccess'?(canAsk?'<button type="button" class="btn btn-primary btn-block" id="naRequest">Request access</button>':'<button type="button" class="btn btn-primary btn-block" id="naHelp">Contact support</button>'):why==='blocked'&&url?`<a class="btn btn-primary btn-block" id="lpLink" href="${esc(url)}" target="_blank" rel="noopener">Open ${n}</a>`:'<button type="button" class="btn btn-primary btn-block" id="lpRetry">Try again</button>';
 const m=openModal('launchModal',`<div class="am-top"><span class="am-ic ic-${k}">${ic(appDef(k).icon,40)}</span><h2 id="launchModal-t">${why==='noaccess'?'No access yet':why==='blocked'?'Open '+n:"Couldn't open "+n}</h2></div><div class="msg-err" id="${why==='noaccess'?'openNoAccess':'openErr'}" role="alert">${ic(why==='noaccess'?'lock':'triangle-alert',16)}<span>${text}</span></div><div class="acts-col" style="margin-top:12px">${act}<button type="button" class="btn btn-outline btn-block" data-close>Close</button></div>`,{opener});
 const back=()=>document.querySelector(`[data-k="tile-${k}"]`)||opener;
 const on=(id,f)=>{const b=m.querySelector(id);if(b)b.onclick=()=>{closeModal({noReturn:true});f()}};
 on('#lpRetry',()=>launchApp(k,back()));
 on('#naRequest',()=>requestModal(k,back()));
 on('#naHelp',()=>helpModal($('#helpBtn')));
}
function propPickModal(k,opener){
 const n=appDef(k).name,props=hubProps();
 const m=openModal('propModal',`<h2 id="propModal-t">Which building?</h2><p class="lead">${n} works one building at a time. Pick one and the Hub switches to it too.</p><div class="acts-col" id="propPick">${props.map(p=>`<button type="button" class="btn btn-outline btn-block" data-pick="${p.k}">${ic('building',16)}${esc(p.name)}</button>`).join('')}</div><div class="acts-col" style="margin-top:8px"><button type="button" class="btn btn-ghost btn-block" data-close>Cancel</button></div>`,{opener,focus:'[data-pick]'});
 m.querySelectorAll('[data-pick]').forEach(b=>{b.onclick=()=>{const v=b.dataset.pick;if(!P(v))return;setHubProp(v);closeModal({noReturn:true});const t=document.querySelector(`[data-k="tile-${k}"]`);t&&t.focus();launchApp(k,t||opener,{prop:v})}});
}
function appDetailModal(k,opener){

 const m=openModal('appModal',`<div class="am-top"><span class="am-ic ic-${k}">${ic(a.icon,40)}</span><h2 id="appModal-t">${a.name}</h2><span class="chip c-${c}" id="amState">${ic(i,13)}${t}</span></div><p class="small muted" style="text-align:center;margin:6px 0 0">${a.category} · ${LIFECYCLE[s.lifecycle].label}</p>${wt?`<p class="why" id="amWhy">${ic(wi,15)}<span>${wt}</span></p>`:''}${acts?`<div class="acts-col">${acts}</div>`:''}<p class="am-desc">${a.description}</p><ul class="am-list">${a.highlights.map(x=>`<li>${ic('check',14)}<span>${x}</span></li>`).join('')}</ul>`,{opener});
 const key=modalStack.at(-1).key,back=()=>document.querySelector(`[data-k="${key}"]`)||opener;
 const nb=m.querySelector('#amNotify');if(nb)nb.onclick=()=>{const on=!SETTINGS.notifyReady[k],nr=Object.assign({},SETTINGS.notifyReady);if(on)nr[k]=true;else delete nr[k];settingsSave({notifyReady:nr},true);nb.setAttribute('aria-checked',on);live(on?`We'll tell you when ${a.name} is ready.`:'Okay, no reminder.')};
 const rv=m.querySelector('#amReview');if(rv)rv.onclick=()=>{closeModal({noReturn:true});hubReview(k)};
 const ak=m.querySelector('#amAsk');if(ak)ak.onclick=()=>{closeModal({noReturn:true});enableReqModal(k,back())};
}

function handleHubClick(t){
 if(t.dataset.tab){S.tab=t.dataset.tab;render();return true}
 if(t.dataset.pin){const k=t.dataset.pin,on=togglePin(k);render();const b=document.querySelector(`[data-k="pin-${k}"]`);b&&b.focus();live(`${appDef(k).name} ${on?'pinned':'unpinned'}.`);return true}
 if(t.dataset.launch){launchApp(t.dataset.launch,t);return true}
 if(t.classList.contains('tile')&&t.dataset.app){launchApp(t.dataset.app,t);return true}
 if(t.id==='browseAll'){S.tab='all';render();const f=document.querySelector(`[data-k="tile-${APP_KEYS[0]}"]`)||$('[data-k="tab-all"]');f&&f.focus();return true}
 return false;
}

function hubSearchApps(){return APP_REGISTRY.map(a=>({key:a.id,label:a.name,terms:a.category+' '+a.keywords+' '+a.shortName,run:()=>focusTile(a.id)}))}

/* First paint: defaults from Settings, unless this tab already had a place (back from an app, reload). */
function hubBoot(){
 if(!uiRestore()){
  S.tab=SETTINGS.defaultView;
  const want=SETTINGS.defaultProp==='last'?SETTINGS.lastProp:SETTINGS.defaultProp;
  if(want&&hubPropChoices().some(x=>x[0]===want))S.prop=want;
 }
 if(!hubPropChoices().some(x=>x[0]===S.prop))S.prop=hubPropChoices()[0][0];
}
/* An app sent the person back: say so and put focus where they left. */
function hubReturn(){
 const r=HubContract.parseReturn();if(!r)return;
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 const a=appDef(r.app);if(!a||S.session!=='ok')return;
 S.view='hub';render();live(r.message||`Back from ${a.name}.`);
 const t=document.querySelector(`[data-k="tile-${a.id}"]`)||$('#main');t.focus({preventScroll:true});
}

 if(t.dataset.sw){const [a,p]=t.dataset.sw.split('|');const u=S.matrixUser;const g=grantFor(u,a,p);if(g){S.grants=S.grants.filter(x=>x!==g);notify(u,'apps',`Your access to ${A(a).name} at ${P(p).name} was removed.`)}else{if(!canGrantApp(a)){live(grantBlockReason(a));return}S.grants.push({user:u,app:a,prop:p,on:S.now});note(`${S.staff.find(x=>x.id===u).name} now has ${A(a).name} at ${P(p).name}.`);notify(u,'appr',`You now have ${A(a).name} at ${P(p).name}.`)}pushShared();render();live(`${A(a).name} at ${P(p).name}: ${g?'access off':'access on'}.`);return}
 if(t.dataset.rqok||t.dataset.rqno){const id=t.dataset.rqok||t.dataset.rqno,r=S.reqs.find(x=>x.id===id),nt=($('#rn-'+id)||{}).value||'';if(!r)return;r.note=nt.trim();
  if(t.dataset.rqok){r.st='approved';if(canGrantApp(r.app)&&!grantFor(r.user,r.app,r.prop))S.grants.push({user:r.user,app:r.app,prop:r.prop,on:S.now})}
  else r.st='denied';
  notify(r.user,'appr',`Your request for ${A(r.app).name} at ${P(r.prop).name} was ${r.st==='approved'?'approved':'not approved'}.${r.note?' Note from your admin: “'+r.note+'”':''}`);
  pushShared();render();live(t.dataset.rqok?'Request approved.':'Request not approved.');$('[data-k="at-requests"]').focus();return}
 if(t.dataset.resend){const u=(S.invites||[]).find(x=>x.id===t.dataset.resend);if(!u||!/^inv-\d+$/.test(u.id))return;u.day=S.now;pushShared();render();live('Invite sent again');const b=document.querySelector(`[data-k="resend-${u.id}"]`);b&&b.focus();return}
 if(t.dataset.cancelinv){cancelInvite(t.dataset.cancelinv,t);return}
 if(t.dataset.accept){const u=(S.invites||[]).find(x=>x.id===t.dataset.accept);if(!u||!/^inv-\d+$/.test(u.id)||u.id===me().id||S.staff.some(x=>x.id===u.id||x.id===me().id&&u.id===me().id)||ASSIGNABLE.indexOf(u.role)<0)return;S.invites=S.invites.filter(x=>x.id!==u.id);S.staff.push({id:u.id,name:u.name,email:u.email,role:u.role,props:u.props,st:'active'});const prop=(u.props&&u.props[0])||'lp';((u.apps||[]).length?u.apps:(S.org.policy.defaultGrant==='company_apps'?APP_KEYS:[])).forEach(k=>{if(canGrantApp(k)&&!grantFor(u.id,k,prop))S.grants.push({user:u.id,app:k,prop,on:S.now})});S.matrixUser=u.id;pushShared();render();live(`${u.name} joined.`);$('#main').focus();return}
}

document.addEventListener('submit',e=>{if(e.target.id!=='invForm')return;e.preventDefault();
 const nm=$('#invName').value.trim(),em=$('#invEmail').value.trim(),er=$('#invErr');
 const bad=!nm?'Please add a name.':!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?'Please enter a full email address, like name@company.':S.staff.concat(S.invites||[]).some(u=>u.email.toLowerCase()===em.toLowerCase())?'This person is already on your team or invited.':'';
 if(bad){er.hidden=false;er.innerHTML=`${ic('circle-alert',15)}<span>${bad}</span>`;$('#invEmail').classList.add('is-err');$('#invEmail').setAttribute('aria-invalid','true');(nm?$('#invEmail'):$('#invName')).focus();return}
 const role=$('#invRole').value;if(ASSIGNABLE.indexOf(role)<0){er.hidden=false;er.innerHTML=`${ic('circle-alert',15)}<span>Choose a role from the list.</span>`;$('#invRole').focus();return}S.invSeq=(S.invSeq||0)+1;let id='inv-'+S.invSeq;while((S.invites||[]).some(x=>x.id===id)||S.staff.some(x=>x.id===id)||id===me().id)id='inv-'+(++S.invSeq);if(!/^inv-\d+$/.test(id)||id===me().id)return;const apps=[...document.querySelectorAll('[data-inv-app]:checked')].map(x=>x.dataset.invApp).filter(k=>canGrantApp(k));(S.invites||(S.invites=[])).push({id,name:nm,email:em,role,props:[$('#invProp').value],apps,st:'invited',day:S.now});
 pushShared();render();live(`Invite sent to ${nm}.`);$('#invName').focus();});
document.addEventListener('change',e=>{
 if(e.target.id==='propSel'){const v=e.target.value;if(!hubPropChoices().some(x=>x[0]===v))return;setHubProp(v);S.loading=true;render();live('Switching building…');setTimeout(()=>{S.loading=false;render();live('Building switched.')},450)}
 if(e.target.id==='mxUser'||e.target.id==='openUser'){S.matrixUser=e.target.value;render()}});
document.addEventListener('keydown',e=>{const t=e.target;if(!t||!t.dataset||!t.dataset.staffflow)return;if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...document.querySelectorAll('[data-staffflow]')];let i=tabs.indexOf(t);if(i<0)return;if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else i=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;e.preventDefault();S.staffPanel=tabs[i].dataset.staffflow;render();const n=document.querySelector(`[data-staffflow="${S.staffPanel}"]`);n&&n.focus()});

function grantKey(uid){return 'ea:cli_001:grants:'+uid}
function reqKey(uid){return 'ea:cli_001:requests:'+uid}
function staffIds(){return S.staff.filter(u=>u.role!=='account_admin').map(u=>u.id)}
function readApps(){const o=storeGet(AMC_APPS);if(!o)return defaultApps();/* EasySpot's console hasn't run here yet: assume its starting catalog */const apps=o.v===1?validApps(o.apps):null;return apps||emptyApps()}
function seedStores(){}
const SAFE_NAME=/^[^<>&"]{2,40}$/;
function validProps(a){if(!Array.isArray(a))return null;const out=[];a.forEach(p=>{if(p&&/^[a-z0-9]{1,12}$/.test(p.k)&&p.k!=='all'&&p.k!=='last'&&typeof p.name==='string'&&SAFE_NAME.test(p.name.trim())&&/^prop_\d+$/.test(p.id)&&!out.some(x=>x.k===p.k))out.push({k:p.k,name:p.name.trim().slice(0,40),id:p.id})});return out.length?out.slice(0,8):null}
function applyShared(){
 S.catalog=readApps();
 const org=storeGet(AMC_ORG);
 if(org&&org.v===1){PROPS=validProps(org.props)||PROPS;const pol=org.policy||{};S.org={policy:{reqTtlDays:[7,14,30].includes(pol.reqTtlDays)?pol.reqTtlDays:14,defaultGrant:pol.defaultGrant==='company_apps'?'company_apps':'none'}}}
 const stf=storeGet(AMC_STAFF);
 if(stf&&stf.v===1&&Array.isArray(stf.staff)){const mine=me(),rest=stf.staff.filter(u=>u&&/^(u_\d+|inv-\d+)$/.test(u.id)&&u.id!==mine.id&&ASSIGNABLE.indexOf(u.role)>=0&&typeof u.name==='string').map(u=>({id:u.id,name:u.name,email:String(u.email||''),role:u.role,props:Array.isArray(u.props)?u.props.filter(p=>P(p)):[],st:'active'}));S.staff=[mine].concat(rest)}
 const eo=storeGet(AMC_ENABLE_OUT),inbox=storeGet(ADMIN_ENABLE),seen={};
 S.enableOut=eo&&eo.v===1&&Array.isArray(eo.reqs)?eo.reqs.filter(r=>r&&/^req_\d+$/.test(r.id)&&APP_KEYS.includes(r.app)&&typeof r.day==='number').map(r=>({id:r.id,app:r.app,day:r.day,reason:String(r.reason||'')})):[];
 S.enableReqs=[];
 (inbox&&inbox.v===1&&Array.isArray(inbox.reqs)?inbox.reqs:[]).forEach(r=>{if(r&&/^req_\d+$/.test(r.id)&&APP_KEYS.includes(r.app)&&REQ_STATES.includes(r.st)&&typeof r.day==='number'){seen[r.id]=1;S.enableReqs.push({id:r.id,app:r.app,st:r.st,day:r.day,kind:'enable'})}});
 S.enableOut.forEach(r=>{if(!seen[r.id])S.enableReqs.push({id:r.id,app:r.app,st:'pending',day:r.day,kind:'enable'})});
 const ent=storeGet(AMC_ENT);
 if(ent&&ent.v===1&&ent.ent)S.ent=Object.assign(emptyEnt(),JSON.parse(JSON.stringify(ent.ent)));
 S.grants=[];S.reqs=[];
 staffIds().forEach(uid=>{
  const g=storeGet(grantKey(uid));
  if(g&&g.v===1&&Array.isArray(g.grants))g.grants.forEach(x=>{if(x&&APP_KEYS.includes(x.app))S.grants.push({user:uid,app:x.app,prop:x.prop,on:x.on})});
  const q=storeGet(reqKey(uid));
  if(q&&q.v===1&&Array.isArray(q.reqs))q.reqs.forEach(r=>{if(r&&r.id&&APP_KEYS.includes(r.app))S.reqs.push(Object.assign({},r,{user:uid,kind:'access'}))});
 });
 const inv=storeGet(AMC_INV);
 S.invites=[];
 if(inv&&inv.v===1&&Array.isArray(inv.invites)){
  inv.invites.forEach(u=>{
   if(!u||!/^inv-\d+$/.test(u.id)||u.id===me().id)return;
   if(ASSIGNABLE.indexOf(u.role)<0)return;S.invites.push({id:u.id,name:u.name,email:u.email,role:u.role,props:Array.isArray(u.props)?u.props.slice():[],apps:Array.isArray(u.apps)?u.apps.filter(k=>APP_KEYS.includes(k)):[],st:'invited',day:u.day||0});
  });
  if(inv.invSeq!=null)S.invSeq=inv.invSeq;
 }
}
function collectShared(){
 storeSet(AMC_ORG,{v:1,props:PROPS.map(p=>({k:p.k,name:p.name,id:p.id})),policy:Object.assign({},S.org.policy)});
 storeSet(AMC_STAFF,{v:1,staff:S.staff.filter(u=>u.id!==me().id&&u.st==='active').map(u=>({id:u.id,name:u.name,email:u.email,role:u.role,props:(u.props||[]).slice()}))});
 storeSet(AMC_ENABLE_OUT,{v:1,reqs:S.enableOut.map(r=>({id:r.id,app:r.app,day:r.day,reason:r.reason}))});
 storeSet(AMC_ENT,{v:1,ent:JSON.parse(JSON.stringify(S.ent))});
 staffIds().forEach(uid=>{
  storeSet(grantKey(uid),{v:1,grants:S.grants.filter(g=>g.user===uid).map(g=>({app:g.app,prop:g.prop,on:g.on}))});
  storeSet(reqKey(uid),{v:1,reqs:S.reqs.filter(r=>r.user===uid).map(r=>({id:r.id,app:r.app,prop:r.prop,st:r.st,day:r.day,reason:r.reason,note:r.note}))});
 });
 storeSet(AMC_INV,{v:1,invSeq:S.invSeq||0,invites:(S.invites||[]).filter(u=>/^inv-\d+$/.test(u.id)&&u.id!==me().id&&ASSIGNABLE.indexOf(u.role)>=0).map(u=>({id:u.id,name:u.name,email:u.email,role:u.role,props:(u.props||[]).slice(),apps:(u.apps||[]).filter(k=>APP_KEYS.includes(k)),st:'invited',day:u.day}))});
}

bindChrome();

function searchIndex(){
 const people=(S.staff||[]).filter(u=>u.st==='active').map(u=>({key:'p-'+u.id,label:u.name,run:()=>{S.view='staff';S.staffPanel=u.role==='account_admin'?'add':'open';if(u.role!=='account_admin')S.matrixUser=u.id;render()}}));
 const pages=[
  {key:'hub',label:'Apps',terms:'hub home launcher',run:()=>go('hub')},
  {key:'access',label:'App access',terms:'requests matrix roles',run:()=>go('access')},
  {key:'staff',label:'Staff',terms:'team invite people',run:()=>go('staff')},
  {key:'profile',label:'Account profile',run:()=>go('profile')},
  {key:'settings',label:'Settings',run:()=>go('settings')}
 ];
 return {apps:hubSearchApps(),buildings:hubSearchBuildings(),people,clients:[],pages,settings:searchSettingsItems()};
}

/* Organization settings: only the account admin's page has them. */
function settingsOrgHTML(head){
 const pol=S.org.policy,opt=(list,cur)=>list.map(([v,l])=>`<option value="${v}"${String(cur)===String(v)?' selected':''}>${l}</option>`).join('');
 return `<div class="card">${head('org','Organization')}<p class="small muted" style="margin:4px 0 0">Only account admins see this. Changes reach your whole team.</p>
 <div class="list" style="margin-top:6px"><div class="li"><span class="muted pf-k">Company</span><span class="pf-v">${esc(CLIENT_COMPANY)} <span class="sample">Sample</span></span></div></div>
 <h3 class="h3" style="margin-top:14px">Buildings</h3>
 ${PROPS.map((p,i)=>`<div class="field"><label for="org-b-${p.k}">Building ${i+1}</label><input id="org-b-${p.k}" data-k="org-b-${p.k}" data-setorg="prop:${p.k}" value="${esc(p.name)}" maxlength="40" autocomplete="off"></div>`).join('')}
 ${PROPS.length<8?`<form id="orgAddForm" class="set-b" novalidate><div class="field"><label for="orgNew">Add a building</label><input id="orgNew" data-k="org-new" maxlength="40" autocomplete="off" aria-describedby="orgNewErr"><div class="err" id="orgNewErr" role="alert" hidden></div></div><button type="submit" class="btn btn-outline" data-k="org-add">${ic('plus',16)}Add</button></form>`:''}
 <h3 class="h3" style="margin-top:16px">Access requests</h3>
 <div class="field"><label for="orgTtl">A request from your team stays open for</label><select id="orgTtl" data-k="org-ttl" data-setorg="ttl">${opt([[7,'7 days'],[14,'14 days'],[30,'30 days']],pol.reqTtlDays)}</select></div>
 <div class="field"><label for="orgGrant">When someone new joins, they can open</label><select id="orgGrant" data-k="org-grant" data-setorg="grant" aria-describedby="orgGrantHelp">${opt([['none','Only the apps I pick in their invite'],['company_apps','Every app on our Hub, at their building']],pol.defaultGrant)}</select><span class="help" id="orgGrantHelp">Used when an invite has no apps picked.</span></div></div>`;
}
function orgNameProblem(name,skip){return name.length<2?'Please use at least 2 characters.':!SAFE_NAME.test(name)?'Please use letters, numbers and simple punctuation only.':PROPS.some(p=>p.k!==skip&&p.name.toLowerCase()===name.toLowerCase())?'You already have a building with that name.':''}
function orgSaved(msg){pushShared();settingsSaved=true;render();live(msg)}
function settingsOrgChange(key,val,el){
 if(key==='ttl'){if([7,14,30].includes(+val)){S.org.policy.reqTtlDays=+val;orgSaved('Saved for your team.')}return}
 if(key==='grant'){if(['none','company_apps'].includes(val)){S.org.policy.defaultGrant=val;orgSaved('Saved for your team.')}return}
 if(key.indexOf('prop:')===0){const p=P(key.slice(5)),name=val.trim();if(!p||name===p.name)return;const bad=orgNameProblem(name,p.k);if(bad){el.value=p.name;live(bad);return}p.name=name.slice(0,40);orgSaved(`Building renamed to ${p.name}.`)}
}
document.addEventListener('submit',e=>{if(e.target.id!=='orgAddForm')return;e.preventDefault();
 const inp=$('#orgNew'),name=inp.value.trim(),bad=orgNameProblem(name,null),err=$('#orgNewErr');
 if(bad){err.hidden=false;err.innerHTML=`${ic('circle-alert',15)}<span>${bad}</span>`;inp.classList.add('is-err');inp.setAttribute('aria-invalid','true');inp.focus();return}
 let n=PROPS.length+1;while(P('b'+n)||PROPS.some(p=>p.id==='prop_'+(100+n)))n++;
 PROPS.push({k:'b'+n,name:name.slice(0,40),id:'prop_'+(100+n)});me().props.push('b'+n);
 notify('cli_001','apps',`${name} was added to your company's buildings.`);orgSaved(`${name} added.`);const f=$('#orgNew');f&&f.focus()});

settingsInit(me().id);

if(window.EA_STANDALONE&&!storeGet(AMC_ENT))loadSample();
hubBoot();bootSession();
S.offline=navigator.onLine===false;
render();
shareReady();
