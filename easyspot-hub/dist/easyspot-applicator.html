<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>EasySpot Applicator</title>
<meta name="description" content="One sign-in for every EasySpot app: parking, resident requests, events and finance, already on the right building.">
<script>(function(){var t=null;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ea-web-theme')}catch(e){}if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';var c=document.documentElement.classList;c.remove('light','dark');c.add(t)})()</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:14px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-6:24px;--s-8:32px;
  --lift-xs:0 1px 2px rgba(15,23,42,.035);
  --lift-sm:0 8px 20px rgba(15,23,42,.06);
  --lift-md:0 12px 32px rgba(15,23,42,.14);
  --lift-lg:0 18px 44px rgba(15,23,42,.16);
  --lift-xl:0 24px 70px rgba(15,23,42,.24);
  --sidebar-w:252px;--header-h:56px;
}
:root,.light{
  color-scheme:light;
  --bg:#F3F6FA;--card:#FFFFFF;--muted:#EEF2F7;--muted-2:#E9EDF1;--border:#E1E8F2;--border-strong:#CBD5E1;
  --fg:#16243D;--fg-2:#334155;--fg-muted:#5B6B82;--fg-subtle:#8492A6;
  --ring:#2563EB;--overlay:rgba(15,23,42,.45);
  --success:#007C46;--success-bg:#EDF9F1;--success-dot:#16A34A;
  --warning:#A46104;--warning-bg:#FFF6E7;--warning-dot:#F59E0B;
  --danger:#C24534;--danger-bg:#FFF1EE;--danger-dot:#EF4444;--danger-solid:#C2321F;
  --info:#2E5FA5;--info-bg:#DDEAFA;--info-dot:#3B82F6;
  --neutral:#475569;--neutral-bg:#EEF2F7;
  --grid:#E8EDF4;--card-ring:rgba(22,36,61,.06);
  --hub:#16243D;--hub-fg:#FFFFFF;--hub-t:#16243D;--hub-soft:#EAEFF6;--hub-side:#26385C;
  --ops:#2B55F2;--ops-fg:#FFFFFF;--ops-t:#2B55F2;--ops-soft:#EDF2FF;--ops-side:#2B55F2;
  --home:#0F766E;--home-fg:#FFFFFF;--home-t:#0F766E;--home-soft:#E3F5F1;--home-side:#0F766E;
  --fin:#7C3AED;--fin-fg:#FFFFFF;--fin-t:#7C3AED;--fin-soft:#F2ECFF;--fin-side:#7C3AED;
  --evt:#DB2777;--evt-fg:#FFFFFF;--evt-t:#BE185D;--evt-soft:#FCE7F3;--evt-side:#DB2777;
  --cli:#B45309;--cli-fg:#FFFFFF;--cli-t:#B45309;--cli-soft:#FEF3E2;--cli-side:#B45309;
}
.dark{
  color-scheme:dark;
  --bg:#0A0F1C;--card:#111827;--muted:#182134;--muted-2:#1E293B;--border:#233047;--border-strong:#33425C;
  --fg:#E6EBF3;--fg-2:#C9D3E1;--fg-muted:#94A3B8;--fg-subtle:#6B7A90;
  --ring:#7C9BFF;--overlay:rgba(2,6,23,.65);
  --success:#4ADE80;--success-bg:rgba(34,197,94,.13);--success-dot:#22C55E;
  --warning:#FBBF24;--warning-bg:rgba(245,158,11,.14);--warning-dot:#F59E0B;
  --danger:#F87171;--danger-bg:rgba(239,68,68,.14);--danger-dot:#EF4444;--danger-solid:#DC2626;
  --info:#7DB3FF;--info-bg:rgba(59,130,246,.15);--info-dot:#60A5FA;
  --neutral:#A7B4C6;--neutral-bg:rgba(148,163,184,.12);
  --grid:#1C2639;--card-ring:rgba(255,255,255,.04);
  --lift-xs:0 1px 2px rgba(0,0,0,.3);--lift-sm:0 8px 20px rgba(0,0,0,.35);--lift-md:0 12px 32px rgba(0,0,0,.5);--lift-lg:0 18px 44px rgba(0,0,0,.55);--lift-xl:0 24px 70px rgba(0,0,0,.6);
  --hub:#E6EBF3;--hub-fg:#16243D;--hub-t:#E6EBF3;--hub-soft:rgba(230,235,243,.08);--hub-side:#26385C;
  --ops:#2B55F2;--ops-t:#94AFFF;--ops-soft:rgba(43,85,242,.18);
  --home:#0F766E;--home-t:#2DD4BF;--home-soft:rgba(20,184,166,.15);
  --fin:#7C3AED;--fin-t:#B9A1FF;--fin-soft:rgba(124,58,237,.2);
  --evt:#DB2777;--evt-t:#F9A8D4;--evt-soft:rgba(219,39,119,.18);
  --cli:#B45309;--cli-t:#FCD34D;--cli-soft:rgba(217,119,6,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{display:flex;flex-direction:column;min-height:100vh;font-family:var(--font-sans);font-size:14px;line-height:1.45;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.light{--chip-ok:#006B3C;--chip-ok-bg:#E6F6EC;--chip-new:#1D4E9E;--chip-new-bg:#E2ECFB;--chip-wait:#7A4600;--chip-wait-bg:#FFF2DB;--chip-lock:#475569;--chip-lock-bg:#EEF2F7;--chip-add:#334155;--chip-add-bg:#F3F6FA;--err:#B42318;--sel:#16243D;--sel-fg:#fff}
.dark{--chip-ok:#4ADE80;--chip-ok-bg:#0F2A1C;--chip-new:#93C5FD;--chip-new-bg:#10233F;--chip-wait:#FCD34D;--chip-wait-bg:#2A2109;--chip-lock:#B4C0D0;--chip-lock-bg:#1B2436;--chip-add:#C9D3E1;--chip-add-bg:#172033;--err:#FCA5A5;--sel:#E6EBF3;--sel-fg:#16243D}
.skip{position:absolute;left:8px;top:-100px;z-index:200;background:var(--card);color:var(--fg);padding:12px 16px;border-radius:8px;border:2px solid var(--ring);min-height:44px}
.skip:focus{top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;background:none;color:var(--fg);text-align:center}
.btn-primary{background:var(--sel);color:var(--sel-fg)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-outline{background:var(--card);border-color:var(--border-strong);color:var(--fg)}
.btn-outline:hover{background:var(--muted)}
.btn-ghost{color:var(--fg-2)}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:var(--card);border-color:var(--border-strong);color:var(--err)}
.btn-icon{padding:0;width:44px}
.btn:disabled{cursor:not-allowed;background:var(--muted);color:var(--fg-muted);border-color:var(--border)}
.btn-block{width:100%}
.demo-strip{display:flex;align-items:center;gap:8px;padding:6px 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-top:max(6px,env(safe-area-inset-top));background:#2A1F05;color:#FDE68A;font-size:12.5px;border-bottom:1px solid #4A3A10;flex-wrap:wrap}
.demo-strip .lbl{font-weight:700;letter-spacing:.02em}
.demo-strip .grow{flex:1}
.seg{display:inline-flex;padding:3px;gap:3px;border-radius:12px;background:var(--muted);border:1px solid var(--border)}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--fg-2);font-weight:600;cursor:pointer}
.seg button[aria-checked=true]{background:var(--sel);color:var(--sel-fg)}
.demo-strip .seg{background:#3A2C08;border-color:#5A4614}
.demo-strip .seg button{color:#FDE68A}
.demo-strip .seg button[aria-checked=true]{background:#FDE68A;color:#2A1F05}
.demo-strip .btn{color:#FDE68A;border-color:#5A4614}
.demo-strip .btn:hover{background:#3A2C08}
.shell{flex:1;display:grid;grid-template-columns:minmax(0,1fr)}
#app{flex:1;display:flex;flex-direction:column}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:#0E1528;color:#E6EBF3;display:flex;flex-direction:column;z-index:80;transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s;padding-bottom:env(safe-area-inset-bottom)}
.sidebar.open{transform:none;visibility:visible}
.sb-scrim{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:70}
.sb-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
.sb-logo{width:36px;height:36px;border-radius:10px;background:#26385C;display:grid;place-items:center;color:#fff}
.sb-brand b{display:block;font-size:15px}
.sb-brand span{font-size:12px;color:#A9B5C9}
.sb-close{margin-left:auto;color:#E6EBF3}
.sb-ws{margin:8px 12px;padding:10px 12px;border-radius:12px;background:#151E36;border:1px solid #26324D;display:flex;flex-direction:column;gap:6px}
.sb-ws .k{font-size:12px;color:#A9B5C9}
.sb-ws .v{font-size:14px;font-weight:600;color:#F1F5F9}
.sb-ws select{min-height:44px;border-radius:10px;background:#0E1528;color:#F1F5F9;border:1px solid #7A8BA6;padding:0 10px;width:100%}
.sb-nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
.sb-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A9B5C9;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:none;color:#D5DCE8;font-size:14px;cursor:pointer;text-align:left;margin-bottom:8px}
.sb-item:hover{background:#17213B;color:#fff}
.sb-item[aria-current=page]{background:#26385C;color:#fff;font-weight:600}
.sb-item .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#FCD34D;color:#1F1300;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.av{width:36px;height:36px;border-radius:50%;background:#B45309;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.topbar .ttl{flex:1;min-width:0;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.topbar .ttl .sb-logo{width:30px;height:30px;border-radius:8px}
.hdr-search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
.hdr-search-ic{position:absolute;left:12px;color:var(--fg-muted);pointer-events:none;display:grid;place-items:center}
#hdrSearch{width:100%;min-width:0;min-height:44px;padding:0 12px 0 38px;border-radius:10px;border:1px solid var(--input-border);background:var(--bg);color:var(--fg);font-size:15px}
#hdrSearch:focus{outline:2px solid var(--ring);outline-offset:1px}
.hdr-search-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:80;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--lift-lg,0 8px 24px rgba(15,23,42,.16));max-height:min(70vh,420px);overflow:auto}
.hdr-search-h{padding:8px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted)}
.hdr-search-opt{padding:8px 12px;min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--fg)}
.hdr-search-opt[aria-selected="true"],.hdr-search-opt:hover{background:var(--muted)}
.hdr-search-empty{padding:14px 12px;color:var(--fg-muted)}
.bell{position:relative}
.bell .dotc{position:absolute;top:6px;right:5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#B42318;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.offline{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--chip-wait-bg);color:var(--chip-wait);font-size:13.5px}
main{padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom));outline:none;width:100%;max-width:880px}
h1{margin:0;font-size:22px;line-height:28px;letter-spacing:-.01em}
h2{margin:0;font-size:18px;line-height:24px}
h3{margin:0;font-size:15px}
.sub{margin:4px 0 0;color:var(--fg-muted);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sample{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px dashed var(--border-strong);color:var(--fg-muted);font-size:12px;font-weight:600}
.hub-head{display:flex;flex-direction:column;gap:14px;max-width:560px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:12px;color:var(--fg-muted);pointer-events:none}
.search input{width:100%;min-height:44px;padding:0 12px 0 38px;border-radius:10px;border:1px solid var(--input-border);background:var(--card);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:560px;margin-top:16px}
.tile{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--border);color:var(--fg);cursor:pointer;min-width:0;box-shadow:var(--lift-xs);text-align:center}
.tile:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.tile .t-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.tile[data-state=locked] .t-ic,.tile[data-state=request_access] .t-ic,.tile[data-state=available] .t-ic{filter:saturate(.35)}
.tile[data-state=available]{border-style:dashed}
.t-n{font-size:14px;font-weight:700;max-width:100%;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.25}
.c-open{background:var(--chip-ok-bg);color:var(--chip-ok)}
.c-new{background:var(--chip-new-bg);color:var(--chip-new)}
.c-pending{background:var(--chip-wait-bg);color:var(--chip-wait)}
.c-locked{background:var(--chip-lock-bg);color:var(--chip-lock)}
.c-request_access{background:var(--chip-lock-bg);color:var(--chip-lock)}
.c-available{background:var(--chip-add-bg);color:var(--chip-add)}
.t-line{font-size:12px;color:var(--fg-muted);line-height:1.3}
.tile.add{border:1.5px dashed var(--border-strong);background:transparent;color:var(--fg-2)}
.tile.add .t-ic{background:var(--muted);color:var(--fg-2)}
.ic-ops{background:#2B55F2}.ic-home{background:#0F766E}.ic-evt{background:#DB2777}.ic-fin{background:#7C3AED}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 16px;margin-top:16px;border:1px dashed var(--border-strong);border-radius:18px;max-width:560px;background:var(--card)}
.empty .e-ic{width:56px;height:56px;border-radius:16px;background:var(--muted);display:grid;place-items:center;color:var(--fg-2)}
.empty p{margin:0;color:var(--fg-2);max-width:360px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--muted);color:var(--fg-2);font-size:13.5px;margin-top:14px;max-width:560px}
.note .ic{margin-top:2px}
.skel{aspect-ratio:1/1;border-radius:18px;background:var(--muted);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.6}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.sidebar{transition:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row .grow{flex:1;min-width:160px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.mini-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.muted{color:var(--fg-muted)}
.small{font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-top:14px;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 12px;border:0;background:none;color:var(--fg-muted);font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--chip-wait-bg);color:var(--chip-wait);font-size:12px;display:inline-grid;place-items:center}
.sw{display:inline-flex;align-items:center;gap:10px;text-align:left;min-height:44px;min-width:44px;padding:0 6px;border:0;background:none;cursor:pointer;color:var(--fg)}
.sw .trk{position:relative;width:40px;height:24px;border-radius:999px;background:var(--input-border);flex:none}
.sw .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true] .trk{background:#007C46}
.sw[aria-checked=true] .trk::after{transform:translateX(16px)}
.sw:disabled{cursor:not-allowed;color:var(--fg-muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.field label{font-size:13px;font-weight:600;color:var(--fg-2)}
.field input,.field select,.field textarea{min-height:44px;width:100%;border:1px solid var(--input-border);background:var(--card);border-radius:10px;padding:8px 12px;font-size:15px}
.field textarea{min-height:96px;resize:vertical}
.field .help{font-size:12.5px;color:var(--fg-muted)}
.field .err{font-size:13px;color:var(--err);display:flex;gap:6px;align-items:flex-start}
.field .is-err{border-color:var(--err);border-width:2px}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.dialog{position:relative;width:100%;max-height:calc(100vh - 24px);overflow:auto;background:var(--card);color:var(--fg);border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:max(20px,env(safe-area-inset-bottom));box-shadow:var(--lift-xl);border:1px solid var(--border)}
.dialog .x{position:absolute;top:8px;right:8px}
.dialog h2{padding-right:44px}
.dialog .lead{margin:6px 0 0;color:var(--fg-2)}
.am-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.am-top h2{padding:0}
.am-ic{width:80px;height:80px;border-radius:22px;display:grid;place-items:center;color:#fff}
.am-desc{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--border);color:var(--fg-2)}
.acts-col{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.why{font-size:13px;color:var(--fg-2);display:flex;gap:6px;align-items:center;justify-content:center}
.msg-err{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--chip-wait-bg);color:var(--chip-wait);margin-top:12px;font-size:14px}
.cat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cat-opt{display:flex;gap:12px;align-items:center;padding:10px 12px;min-height:64px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--fg);cursor:pointer;text-align:left;width:100%}
.cat-opt[aria-checked=true]{border:2px solid var(--fg)}
.cat-opt:disabled{cursor:not-allowed;background:var(--muted)}
.cat-opt .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-opt .grow span{font-size:13px;color:var(--fg-muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.li:first-child{border-top:0}
.full{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 16px;max-width:520px;margin:0 auto}
.full .e-ic{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;color:#fff;background:#475569}
.full p{margin:0;color:var(--fg-2)}
.app-head{display:flex;align-items:center;gap:12px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

  -> {ok, ctx, errors}\n               HubContract.backUrl(ctx, info)      -> where \"Back to Hub\" goes\n               HubContract.notifyHub(ctx, note)    -> put a line under the Hub bell\n               HubContract.signedOut(userId)       -> true once the Hub signed the user out */\n(function(root){\n const VERSION=1;\n const FIELDS=['app','companyId','company','propertyId','propertyKey','property','role','userId','user','theme','locale','dateFormat','timeZone','returnUrl'];\n const REQUIRED=['app','companyId','role','userId','returnUrl'];\n const RETURN_MARK='#hub-return=';\n const CHANNEL='ea-store';\n\n /* Only ever go back to a page on this origin: no open redirects, no script URLs. */\n function safeUrl(u,base,hubOrigins){\n  try{\n   const here=new URL(base||root.location.href),x=new URL(String(u),here);\n   if(!/^(https?|file):$/.test(x.protocol))return null;\n   if(x.protocol===here.protocol&&x.host===here.host)return x.href;\n   /* An app on another site lists the Hub origins it trusts, e.g. ['https://hub.example.com']. */\n   return x.protocol==='https:'&&Array.isArray(hubOrigins)&&hubOrigins.indexOf(x.origin)>=0?x.href:null;\n  }catch(e){return null}\n }\n\n function build(launch,ctx,base){\n  const u=new URL(launch.url,base||root.location.href);\n  u.searchParams.set('hub',String(VERSION));\n  (launch.params||FIELDS).forEach(k=>{if(ctx[k]!=null&&ctx[k]!=='')u.searchParams.set(k,String(ctx[k]))});\n  return u.href;\n }\n\n function read(search,opts){\n  const o=opts||{},q=new URLSearchParams(search==null?root.location.search:search),ctx={},errors=[];\n  if(q.get('hub')!==String(VERSION))errors.push('hub');\n  FIELDS.forEach(k=>{const v=q.get(k);if(v!=null&&v!=='')ctx[k]=v});\n  REQUIRED.concat(o.require||[]).forEach(k=>{if(!ctx[k])errors.push(k)});\n  if(ctx.returnUrl){const s=safeUrl(ctx.returnUrl,o.base,o.hubOrigins);if(s)ctx.returnUrl=s;else{delete ctx.returnUrl;if(errors.indexOf('returnUrl')\u003c0)errors.push('returnUrl')}}\n  if(ctx.theme!=='dark e.key)){e.preventDefault();const bs=[...g.querySelectorAll('button')];const i=bs.indexOf(e.target);const n=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[n].click();const nb=document.querySelector(`[data-k=\"${bs[n].dataset.k}\"]`)||bs[n];nb.focus()}\n  const mi=e.target.closest&&e.target.closest('#avMenu');\n  if(mi&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const bs=[...mi.querySelectorAll('[role=menuitem]')];const i=bs.indexOf(e.target);const n=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[n].focus()}\n  if(e.target.id==='avBtn'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openAv(e.key==='ArrowUp')}\n });\n matchMedia('(min-width:1024px)').addEventListener('change',()=>{if(isDesk())closeDrawer(false)});\n addEventListener('offline',()=>{S.offline=true;render()});addEventListener('online',()=>{S.offline=false;render()});\n bindSearch();\n}\n\n/* What the person was looking at survives a trip into an app and back (per tab, per role). */\nconst UI_KEYS=['view','tab','prop','now','accessTab','staffPanel','matrixUser','client'];\nfunction uiKey(){return 'ea-hub-ui:'+storeRole()}\nfunction uiSave(){try{const o={};UI_KEYS.forEach(k=>{if(S[k]!==undefined&&S[k]!==null)o[k]=S[k]});sessionStorage.setItem(uiKey(),JSON.stringify(o))}catch(e){}}\nfunction uiRestore(){let o=null;try{o=JSON.parse(sessionStorage.getItem(uiKey())||'null')}catch(e){}if(!o||typeof o!=='object')return false;UI_KEYS.forEach(k=>{if(o[k]!==undefined&&k in S&&(S[k]===null||typeof o[k]===typeof S[k]))S[k]=o[k]});if(S.view==='nf')S.view=S.homeView;return true}\n/* Nobody gets a workspace without signing in at the front door (index.html). Returns false when leaving. */\nfunction bootSession(){let rec=null;try{rec=localStorage.getItem(HubContract.sessionKey(me().id))}catch(e){}if(rec&&!HubContract.signedOut(me().id))return true;S.session='out';HubContract.go('index','login');return false}\n\u003c/script>\n\u003cscript>\n/* The Hub itself: show the apps, say what state each one is in, and open them.\n   Nothing here manages people, access or companies; that lives in the role page's admin area.\n   The role page supplies: hubStateCtx(), hubProps(), hubPropChoices(), PROP_ID(k),\n   and the flows a tap can lead to (addModal / enableReqModal for account admins, requestModal for staff). */\nObject.assign(ICONS,{\n pin:'\u003cpath d=\"M12 17v5\"/>\u003cpath d=\"M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z\"/>',\n building:'\u003cpath d=\"M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z\"/>\u003cpath d=\"M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2\"/>\u003cpath d=\"M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2\"/>\u003cpath d=\"M10 6h4\"/>\u003cpath d=\"M10 10h4\"/>\u003cpath d=\"M10 14h4\"/>\u003cpath d=\"M10 18h4\"/>'});\n\nconst appSt=k=>resolveAppState(k,hubStateCtx());\nconst tileState=k=>appSt(k).state;\nconst curTab=()=>HUB_VIEWS.some(x=>x[0]===S.tab)?S.tab:'all';\nlet launching=null;\n\n/* Chip on a tile: [css state, icon, text]. */\nfunction tileBadge(s){\n if(s.ready&&s.lifecycle==='coming_soon')return ['pending','clock','Coming soon'];\n if(s.ready&&s.lifecycle==='maintenance')return ['pending','triangle-alert','Maintenance'];\n if(s.state==='open'&&s.lifecycle==='beta')return ['new','sparkles','Beta'];\n const label={not_on_account:'Not on your account',request_pending:'Request pending',easyspot_review:'Asked EasySpot',role_not_allowed:'Not for your role'}[s.reason]||APP_STATE[s.state].label;\n return [s.state,APP_STATE[s.state].icon,label];\n}\nfunction stateLine(s){\n if(s.reason==='viewer')return 'Ask your admin for access';\n if(s.reason==='request_pending')return `Sent ${day(s.req.day)} (Sample)`;\n if(s.reason==='request_denied')return 'Not approved · send again';\n if(s.reason==='request_expired')return 'Expired · send again';\n return '';\n}\n/* Why the app can't be opened right now, and what to do next: [icon, text]. */\nfunction stateWhy(s){\n const n=appDef(s.app).name;\n if(s.ready&&s.lifecycle==='coming_soon')return ['clock',`${n} is coming soon. Your access is saved, so it opens from your Hub the day it's ready.`];\n if(s.ready&&s.lifecycle==='maintenance')return ['triangle-alert',`${n} is down for maintenance. Nothing is lost. It opens again when the work is done.`];\n switch(s.reason){\n  case 'company_pending':return ['clock',\"This app is pending approval. It opens once it's approved.\"];\n  case 'request_pending':return ['clock',`Request sent ${day(s.req.day)}. It stays open until ${day(s.req.day+reqTtl(s.req))} (Sample).`];\n  case 'easyspot_review':return ['clock',`You asked EasySpot to turn this on ${day(s.req.day)} (Sample). We'll tell you when they answer.`];\n  case 'easyspot_denied':return ['circle-x',\"EasySpot didn't approve this app for your company. You can ask again.\"];\n  case 'not_enabled':return ['lock',STORE_ROLE==='client'?\"EasySpot hasn't turned this on for your company yet.\":'This app is not available for your company right now.'];\n  case 'not_on_account':return ['lock',\"Your company hasn't added this app yet. Ask your account admin.\"];\n  case 'role_not_allowed':return ['lock',\"Your role can't open this app. Ask your account admin if you need it.\"];\n  case 'viewer':return ['info','Ask your admin for access'];\n }\n return ['info',''];\n}\n\nfunction tileHTML(k){\n const a=appDef(k),s=appSt(k),[c,i,t]=tileBadge(s),line=stateLine(s),pinned=SETTINGS.pins.includes(k);\n if(typeof emitTile==='function')emitTile(k,s);\n return `\u003cdiv class=\"tile-wrap\">\u003cbutton type=\"button\" class=\"tile\" data-k=\"tile-${k}\" data-app=\"${k}\" data-state=\"${s.state}\" data-lifecycle=\"${s.lifecycle}\"${s.reason==='request_pending'?' data-req=\"pending\"':''}${launching===k?' aria-busy=\"true\"':''}>\u003cspan class=\"t-ic ic-${k}\">${ic(a.icon,28)}\u003c/span>\u003cspan class=\"t-n\" id=\"tn-${k}\">${a.name}\u003c/span>\u003cspan class=\"t-d\" id=\"td-${k}\">${a.description}\u003c/span>\u003cspan class=\"chip c-${c}\" id=\"tc-${k}\">${ic(i,13)}${t}\u003c/span>${line?`\u003cspan class=\"t-line\" id=\"tl-${k}\">${esc(line)}\u003c/span>`:''}\u003c/button>\u003cbutton type=\"button\" class=\"pin-btn\" data-k=\"pin-${k}\" data-pin=\"${k}\" aria-pressed=\"${pinned}\" aria-label=\"${pinned?'Unpin':'Pin'} ${a.name}\">${ic('pin',16)}\u003c/button>\u003c/div>`;\n}\nfunction quickHTML(){\n const pins=SETTINGS.pins.filter(k=>appDef(k)),recent=SETTINGS.recent.filter(k=>appDef(k)&&!pins.includes(k));\n const row=(id,title,list)=>list.length?`\u003csection class=\"quick\" aria-labelledby=\"${id}\">\u003ch2 class=\"quick-h\" id=\"${id}\">${title}\u003c/h2>\u003cdiv class=\"quick-row\">${list.map(k=>{const a=appDef(k),s=appSt(k);return `\u003cbutton type=\"button\" class=\"quick-btn\" data-k=\"${id}-${k}\" data-launch=\"${k}\" data-state=\"${s.state}\">\u003cspan class=\"mini-ic ic-${k}\">${ic(a.icon,16)}\u003c/span>\u003cspan>${a.shortName}\u003c/span>${s.launchable?'':`\u003cspan class=\"q-st\">${ic(tileBadge(s)[1],13)}\u003cspan class=\"sr-only\">${tileBadge(s)[2]}\u003c/span>\u003c/span>`}\u003c/button>`}).join('')}\u003c/div>\u003c/section>`:'';\n return row('qPinned','Pinned',pins)+row('qRecent','Recent',recent);\n}\nfunction hubContextLabel(){const p=S.prop==='all'?null:P(S.prop);return CLIENT_COMPANY+' · '+(p?p.name:'All buildings')}\n\nfunction hubView(){\n const tab=curTab(),all=APP_KEYS.map(appSt);\n const count={all:all.length,ready:all.filter(s=>s.ready).length,pending:all.filter(s=>s.state==='pending').length};\n let h=`\u003cdiv class=\"hub-head\">\u003cdiv>\u003ch1>Apps\u003c/h1>\u003cp class=\"sub hub-ctx\" id=\"hubCtx\">${ic('building',15)}\u003cspan>${esc(hubContextLabel())}\u003c/span>\u003cspan class=\"sample\">Sample\u003c/span>\u003c/p>\u003c/div>\n \u003cdiv class=\"seg\" role=\"radiogroup\" aria-label=\"Which apps to show\" id=\"tabSeg\">${HUB_VIEWS.map(([v,l])=>`\u003cbutton type=\"button\" role=\"radio\" data-k=\"tab-${v}\" data-tab=\"${v}\" aria-checked=\"${tab===v}\" tabindex=\"${tab===v?0:-1}\">${l}${v!=='all'&&count[v]?` \u003cspan class=\"seg-n\" aria-label=\"${count[v]} app${count[v]===1?'':'s'}\">${count[v]}\u003c/span>`:''}\u003c/button>`).join('')}\u003c/div>\u003c/div>`;\n if(S.loading)return h+`\u003cdiv class=\"grid\" aria-busy=\"true\" aria-label=\"Loading apps\">${'\u003cdiv class=\"skel\">\u003c/div>'.repeat(4)}\u003c/div>\u003cp class=\"sr-only\">Loading\u003c/p>`;\n h+=quickHTML();\n if(typeof hubNotice==='function')h+=hubNotice(all,tab);\n const shown=all.filter(s=>tab==='ready'?s.ready:tab==='pending'?s.state==='pending':true).map(s=>s.app);\n if(!shown.length){\n  const e=typeof hubEmpty==='function'?hubEmpty(tab):null;\n  return h+`\u003cdiv class=\"empty\" id=\"hubEmpty\">\u003cspan class=\"e-ic\">${ic(tab==='pending'?'clock':'layers',26)}\u003c/span>\u003ch2>${tab==='pending'?'Nothing is pending':'No apps ready yet'}\u003c/h2>\u003cp>${e?e.text:tab==='pending'?'Requests and apps waiting for approval show up here.':'Open \u003cb>All apps\u003c/b> to see what you can get.'}\u003c/p>${e&&e.action?e.action:`\u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"browseAll\" data-k=\"browse-all\">See all apps\u003c/button>`}\u003c/div>`;}\n return h+`\u003cdiv class=\"grid\" id=\"grid\">${shown.map(tileHTML).join('')}${typeof hubExtraTile==='function'?hubExtraTile(all,tab):''}\u003c/div>`;\n}\n\nfunction setHubProp(v){S.prop=v;if(v!=='all')settingsSave({lastProp:v},true)}\nfunction expireSession(){closeAll();S.session='expired';render();const b=$('#signIn');b&&b.focus()}\n\n/* Everything the app needs to start in the right place. See shared/contract.js. */\nfunction hubLaunchCtx(k,prop){\n const u=me(),p=P(prop);\n return {app:k,companyId:AMC_ID,company:CLIENT_COMPANY,propertyKey:p?p.k:'',propertyId:p?PROP_ID(p.k):'',property:p?p.name:'',role:u.role,userId:u.id,user:u.name,theme,locale:SETTINGS.lang,dateFormat:SETTINGS.dateFormat,timeZone:SETTINGS.timeZone,returnUrl:location.href.split('#')[0]};\n}\n\n/* One tap on an app always ends somewhere useful:\n   signed out -> sign in · no access -> the flow that gets access · waiting/locked -> why and what next\n   not launched yet -> preview + \"tell me\" · offline -> say so · needs one building -> pick it · else -> open. */\nfunction launchApp(k,opener,opts){\n const app=appDef(k);if(!app||launching)return;\n if(S.session!=='ok'){expireSession();return}\n const s=appSt(k);\n if(s.state==='available'&&typeof addModal==='function'){addModal(k,opener);return}\n if(s.state==='request_access'&&s.reason!=='viewer'&&typeof requestModal==='function'){requestModal(k,opener);return}\n if(!s.launchable){appDetailModal(k,opener);return}\n if(S.offline){launchProblem(k,opener,'offline');return}\n const prop=(opts&&opts.prop)||S.prop;\n if(app.requiresSingleProperty&&(prop==='all'||!P(prop))){propPickModal(k,opener);return}\n beginLaunch(k,opener,prop);\n}\nfunction beginLaunch(k,opener,prop){\n const app=appDef(k);launching=k;\n const tile=document.querySelector(`[data-k=\"tile-${k}\"]`);tile&&tile.setAttribute('aria-busy','true');\n live(`Opening ${app.name}…`);\n setTimeout(()=>{\n  launching=null;const tl=document.querySelector(`[data-k=\"tile-${k}\"]`);tl&&tl.removeAttribute('aria-busy');\n  const f=S.failNext;S.failNext=null;\n  if(S.session!=='ok'||f==='session'){expireSession();return}\n  if(S.offline||f==='error'){launchProblem(k,opener,S.offline?'offline':'error');return}\n  if(f==='noaccess'||!appSt(k).launchable){launchProblem(k,opener,'noaccess');return}\n  pushRecent(k);uiSave();\n  const url=HubContract.build(launchFor(app,me().role),hubLaunchCtx(k,prop));\n  if(app.launch.target==='blank'){const w=window.open(url,'_blank');if(!w){launchProblem(k,opener,'blocked',url);return}try{w.opener=null}catch(e){}render();live(`${app.name} opened in a new tab.`);return}\n  location.assign(url);\n },450);\n}\nfunction launchProblem(k,opener,why,url){\n const n=appDef(k).name,canAsk=typeof requestModal==='function'&&!(typeof isViewer==='function'&&isViewer());\n const text={offline:`You're offline. ${n} will open when you're back online.`,error:`We couldn't open ${n}. Please try again.`,blocked:`${n} opens in a new tab, and your browser held it back. Use the button below to open it.`,noaccess:`You don't have access to ${n} yet.${canAsk?'':' Ask your account admin to check your access, or contact us from Help.'}`}[why];\n const act=why==='noaccess'?(canAsk?'\u003cbutton type=\"button\" class=\"btn btn-primary btn-block\" id=\"naRequest\">Request access\u003c/button>':'\u003cbutton type=\"button\" class=\"btn btn-primary btn-block\" id=\"naHelp\">Contact support\u003c/button>'):why==='blocked'&&url?`\u003ca class=\"btn btn-primary btn-block\" id=\"lpLink\" href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener\">Open ${n}\u003c/a>`:'\u003cbutton type=\"button\" class=\"btn btn-primary btn-block\" id=\"lpRetry\">Try again\u003c/button>';\n const m=openModal('launchModal',`\u003cdiv class=\"am-top\">\u003cspan class=\"am-ic ic-${k}\">${ic(appDef(k).icon,40)}\u003c/span>\u003ch2 id=\"launchModal-t\">${why==='noaccess'?'No access yet':why==='blocked'?'Open '+n:\"Couldn't open \"+n}\u003c/h2>\u003c/div>\u003cdiv class=\"msg-err\" id=\"${why==='noaccess'?'openNoAccess':'openErr'}\" role=\"alert\">${ic(why==='noaccess'?'lock':'triangle-alert',16)}\u003cspan>${text}\u003c/span>\u003c/div>\u003cdiv class=\"acts-col\" style=\"margin-top:12px\">${act}\u003cbutton type=\"button\" class=\"btn btn-outline btn-block\" data-close>Close\u003c/button>\u003c/div>`,{opener});\n const back=()=>document.querySelector(`[data-k=\"tile-${k}\"]`)||opener;\n const on=(id,f)=>{const b=m.querySelector(id);if(b)b.onclick=()=>{closeModal({noReturn:true});f()}};\n on('#lpRetry',()=>launchApp(k,back()));\n on('#naRequest',()=>requestModal(k,back()));\n on('#naHelp',()=>helpModal($('#helpBtn')));\n}\nfunction propPickModal(k,opener){\n const n=appDef(k).name,props=hubProps();\n const m=openModal('propModal',`\u003ch2 id=\"propModal-t\">Which building?\u003c/h2>\u003cp class=\"lead\">${n} works one building at a time. Pick one and the Hub switches to it too.\u003c/p>\u003cdiv class=\"acts-col\" id=\"propPick\">${props.map(p=>`\u003cbutton type=\"button\" class=\"btn btn-outline btn-block\" data-pick=\"${p.k}\">${ic('building',16)}${esc(p.name)}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"acts-col\" style=\"margin-top:8px\">\u003cbutton type=\"button\" class=\"btn btn-ghost btn-block\" data-close>Cancel\u003c/button>\u003c/div>`,{opener,focus:'[data-pick]'});\n m.querySelectorAll('[data-pick]').forEach(b=>{b.onclick=()=>{const v=b.dataset.pick;if(!P(v))return;setHubProp(v);closeModal({noReturn:true});const t=document.querySelector(`[data-k=\"tile-${k}\"]`);t&&t.focus();launchApp(k,t||opener,{prop:v})}});\n}\nfunction appDetailModal(k,opener){\n const a=appDef(k),s=appSt(k),[c,i,t]=tileBadge(s),[wi,wt]=stateWhy(s);\n let acts='';\n if(s.ready&&!s.launchable)acts=`\u003cbutton type=\"button\" class=\"sw\" role=\"switch\" id=\"amNotify\" aria-checked=\"${!!SETTINGS.notifyReady[k]}\">\u003cspan class=\"trk\">\u003c/span>\u003cspan>Tell me when it's ready\u003c/span>\u003c/button>`;\n else if(s.reason==='company_pending'&&typeof hubReview==='function')acts='\u003cbutton type=\"button\" class=\"btn btn-outline btn-block\" id=\"amReview\">Review in App access\u003c/button>';\n else if((s.reason==='not_enabled'||s.reason==='easyspot_denied')&&typeof enableReqModal==='function')acts=`\u003cbutton type=\"button\" class=\"btn btn-primary btn-block\" id=\"amAsk\">${s.reason==='easyspot_denied'?'Ask again':'Ask EasySpot to turn it on'}\u003c/button>`;\n const m=openModal('appModal',`\u003cdiv class=\"am-top\">\u003cspan class=\"am-ic ic-${k}\">${ic(a.icon,40)}\u003c/span>\u003ch2 id=\"appModal-t\">${a.name}\u003c/h2>\u003cspan class=\"chip c-${c}\" id=\"amState\">${ic(i,13)}${t}\u003c/span>\u003c/div>\u003cp class=\"small muted\" style=\"text-align:center;margin:6px 0 0\">${a.category} · ${LIFECYCLE[s.lifecycle].label}\u003c/p>${wt?`\u003cp class=\"why\" id=\"amWhy\">${ic(wi,15)}\u003cspan>${wt}\u003c/span>\u003c/p>`:''}${acts?`\u003cdiv class=\"acts-col\">${acts}\u003c/div>`:''}\u003cp class=\"am-desc\">${a.description}\u003c/p>\u003cul class=\"am-list\">${a.highlights.map(x=>`\u003cli>${ic('check',14)}\u003cspan>${x}\u003c/span>\u003c/li>`).join('')}\u003c/ul>`,{opener});\n const key=modalStack.at(-1).key,back=()=>document.querySelector(`[data-k=\"${key}\"]`)||opener;\n const nb=m.querySelector('#amNotify');if(nb)nb.onclick=()=>{const on=!SETTINGS.notifyReady[k],nr=Object.assign({},SETTINGS.notifyReady);if(on)nr[k]=true;else delete nr[k];settingsSave({notifyReady:nr},true);nb.setAttribute('aria-checked',on);live(on?`We'll tell you when ${a.name} is ready.`:'Okay, no reminder.')};\n const rv=m.querySelector('#amReview');if(rv)rv.onclick=()=>{closeModal({noReturn:true});hubReview(k)};\n const ak=m.querySelector('#amAsk');if(ak)ak.onclick=()=>{closeModal({noReturn:true});enableReqModal(k,back())};\n}\n\nfunction handleHubClick(t){\n if(t.dataset.tab){S.tab=t.dataset.tab;render();return true}\n if(t.dataset.pin){const k=t.dataset.pin,on=togglePin(k);render();const b=document.querySelector(`[data-k=\"pin-${k}\"]`);b&&b.focus();live(`${appDef(k).name} ${on?'pinned':'unpinned'}.`);return true}\n if(t.dataset.launch){launchApp(t.dataset.launch,t);return true}\n if(t.classList.contains('tile')&&t.dataset.app){launchApp(t.dataset.app,t);return true}\n if(t.id==='browseAll'){S.tab='all';render();const f=document.querySelector(`[data-k=\"tile-${APP_KEYS[0]}\"]`)||$('[data-k=\"tab-all\"]');f&&f.focus();return true}\n return false;\n}\nfunction focusTile(k){S.view='hub';S.tab='all';render();const t=document.querySelector(`[data-k=\"tile-${k}\"]`)||$('#mai kafor@amcllc.sample',role:'account_admin',props:['lp','mc'],st:'active'},\n        {id:'u_002',name:'Maria Lopez',email:'maria.lopez@amcllc.sample',role:'property_manager',props:['lp'],st:'active'}],\n});\nlet S=fresh();\nconst me=()=>S.staff.find(u=>u.id==='u_001');\nconst badRole=()=>!ROLES[me().role]||me().role==='unset';\nfunction grantFor(user,app,prop){return S.grants.find(g=>g.user===user&&g.app===app&&g.prop===prop)}\nfunction catalogOn(k){return !!(S.catalog&&S.catalog[k])}\nfunction companyHas(k){return !!(S.ent[k]&&S.ent[k].st==='active')}\nfunction canGrantApp(k){return catalogOn(k)&&companyHas(k)}\nfunction grantBlockReason(k){if(!catalogOn(k))return \"EasySpot hasn't turned this on for your company.\";if(!companyHas(k))return 'Add this app for your company first.';return ''}\n/* What the Hub (shared/hub-view.js) needs to know about this person. */\nfunction hubStateCtx(){return {role:'client',userRole:me().role,catalog:S.catalog,ent:S.ent,enableReqs:S.enableReqs,prop:S.prop,now:S.now}}\nconst hubProps=()=>PROPS;\nconst hubPropChoices=()=>[['all','All buildings']].concat(PROPS.map(p=>[p.k,p.name]));\nconst PROP_ID=k=>(P(k)||{}).id||null;\nfunction hubEmpty(tab){return tab==='ready'?{text:\"Next step: tap \u003cb>Add app\u003c/b> to pick your first EasySpot app. Once it's approved, it appears here, ready to open.\",action:`\u003cbutton type=\"button\" class=\"btn btn-primary\" id=\"emptyAdd\" data-k=\"empty-add\">${ic('plus',16)}Add app\u003c/button>`}:null}\nfunction hubExtraTile(all,tab){return tab==='ready'&&all.some(s=>s.state==='available')?`\u003cbutton type=\"button\" class=\"tile add\" id=\"addTile\" data-k=\"add-tile\" aria-label=\"Add app\">\u003cspan class=\"t-ic\">${ic('plus',26)}\u003c/span>\u003cspan class=\"t-n\">Add app\u003c/span>\u003c/button>`:''}\nfunction hubReview(){S.view='access';S.accessTab='apps';render();$('#main').focus()}\nconst ENUM=APP_STATES;\nwindow.__events=window.__events||[];\nconst DEBUG=()=>{try{return new URLSearchP  class=\"small muted\">'+esc(why)+'\u003c/div>'}\u003c/div>\u003c/div>${act?`\u003cdiv class=\"stack\" style=\"margin-top:6px\">${PROPS.map(p=>{const on=!!grantFor(u.id,a.k,p.k),ass=u.props.includes(p.k);return `\u003cbutton type=\"button\" class=\"sw\" role=\"switch\" data-k=\"sw-${a.k}-${p.k}\" data-sw=\"${a.k}|${p.k}\" aria-checked=\"${on}\" ${ass?'':'disabled'}>\u003cspan class=\"trk\">\u003c/span>\u003cspan>${p.name}${ass?'':' · not assigned to this person'}\u003c/span>\u003c/button>`}).join('')}\u003c/div>`:''}\u003c/div>`}).join('');}}\n if(S.accessTab==='roles'){\n  h+=[['Account admin','Adds apps, approves requests and gives people access across the whole account.'],['Property manager, Leasing, Maintenance','Open the apps they were given for their buildings, and ask for more.'],['Viewer','Opens the apps they were given. To get more, they ask an admin.']].map(([t,d])=>`\u003cdiv class=\"card\">\u003ch2 class=\"h3\">${t}\u003c/h2>\u003cp class=\"small muted\" style=\"margin:4px 0 0\">${d}\u003c/p>\u003c/div>`).join('');}\n if(S.accessTab==='requests'){\n  const rs=S.reqs.slice().sort((a,b)=>String(b.id).localeCompare(String(a.id)));\n  if(!rs.length)h+=`\u003cdiv class=\"card\" id=\"noReqs\">No access requests right now.\u003c/div>`;\n  h+=rs.map(r=>{const u=S.staff.find(x=>x.id===r.user);const vs=reqViewSt(r);const rs=REQ_STATE[vs],st=[rs.chip,rs.icon,vs==='pending'?`${rs.label} · expires ${day(r.day+reqTtl(r))}`:rs.label];\n   return `\u003cdiv class=\"card\" data-req-row=\"${r.id}\">\u003cdiv class=\"row\">\u003cspan class=\"mini-ic ic-${r.app}\">${ic(A(r.app).icon,18)}\u003c/span>\u003cdiv class=\"grow\">\u003ch2 class=\"h3\">${esc(u.name)} · ${A(r.app).name}\u003c/h2>\u003cdiv class=\"small muted\">${P(r.prop).name} · sent ${day(r.day)} (Sample)\u003c/div>\u003c/div>\u003cspan class=\"chip ${st[0]}\">${ic(st[1],13)}${st[2]}\u003c/span>\u003c/div>\u003cp class=\"small\" style=\"margin:8px 0 0\">“${esc(r.reason)}”\u003c/p>${vs==='pending'?`\u003cdiv class=\"field\">\u003clabel for=\"rn-${r.id}\">Note to ${esc(u.name.split(' ')[0])} (optional)\u003c/label>\u003cinput id=\"rn-${r.id}\" data-k=\"rn-${r.id}\">\u003c/div>\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cdiv class=\"acts\">\u003cbutton type=\"button\" class=\"btn btn-primary\" data-k=\"rq-ok-${r.id}\" data-rqok=\"${r.id}\">${ic('check',16)}Approve\u003c/button>\u003cbutton type=\"button\" class=\"btn btn-danger\" data-k=\"rq-no-${r.id}\" data-rqno=\"${r.id}\">Don't approve\u003c/button>\u003c/div>\u003c/div>`:''}\u003c/div>`}).join('');}\n return h+'\u003c/div>';}\n\nfunction staffView(){\n const inv=S.invites||[];\n const panel=S.staffPanel==='open'?'open':'add';\n const people=S.staff.filter(u=>u.role!=='account_admin'&&u.st==='active');\n const openId=people.some(p=>p.id===S.matrixUser)?S.matrixUser:(people[0]&&people[0].id);\n const u=people.find(p=>p.id===openId);\n const appPicks=()=>APPS.map(a=>{const ok=canGrantApp(a.k),why=grantBlockReason(a.k);return `\u003clabel class=\"app-pick${ok?'':' is-off'}\" for=\"invApp-${a.k}\">\u003cinput type=\"checkbox\" id=\"invApp-${a.k}\" data-k=\"inv-app-${a.k}\" data-inv-app=\"${a.k}\" ${ok?'':'disabled'} ${why?`aria-describedby=\"invAppWhy-${a.k}\"`:''}>\u003cspan>\u003cb>${a.name}\u003c/b>${why?`\u003cspan class=\"small muted\" id=\"invAppWhy-${a.k}\">${esc(why)}\u003c/span>`:''}\u003c/span>\u003c/label>`}).join('');\n const add=`\u003cform class=\"card\" id=\"invForm\" novalidate>\u003ch2 id=\"staffAddH\">Add staff\u003c/h2>\n \u003cp class=\"small muted\" style=\"margin:4px 0 10px\">Invite a new person and, if you want, pick the apps they can open when they join.\u003c/p>\n \u003cdiv class=\"field\">\u003clabel for=\"invName\">Name\u003c/label>\u003cinput id=\"invName\" data-k=\"inv-name\" autocomplete=\"off\">\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"invEmail\">Email\u003c/label>\u003cinput id=\"invEmail\" data-k=\"inv-email\" type=\"email\" autocomplete=\"off\" aria-describedby=\"invErr\">\u003cdiv class=\"err\" id=\"invErr\" hidden>\u003c/div>\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"invRole\">Role\u003c/label>\u003cselect id=\"invRole\" data-k=\"inv-role\">${ASSIGNABLE.map(r=>`\u003coption value=\"${r}\">${ROLES[r]}\u003c/option>`).join('')}\u003c/select>\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"invProp\">Building\u003c/label>\u003cselect id=\"invProp\" data-k=\"inv-prop\">${PROPS.map(p=>`\u003coption value=\"${p.k}\">${p.name}\u003c/option>`).join('')}\u003c/select>\u003cspan class=\"help\">Buildings come from your onboarding (Sample).\u003c/span>\u003c/div>\n \u003cfieldset class=\"app-picks\" id=\"invApps\">\u003clegend>Initial apps\u003c/legend>\u003cp class=\"help\" id=\"invAppsHelp\">Only apps EasySpot has turned on for your company can be opened for this person.\u003c/p>${appPicks()}\u003c/fieldset>\n \u003cdiv style=\"margin-top:14px\">\u003cbutton type=\"submit\" class=\"btn btn-primary\" id=\"invSend\" data-k=\"inv-send\">Send invite\u003c/button>\u003c/div>\u003c/form>\n \u003cdiv class=\"card\">\u003ch2>Waiting to join \u003cspan class=\"chip c-pending\" id=\"invCount\">${inv.length}\u003c/span>\u003c/h2>\u003cdiv class=\"list\" id=\"invList\">${inv.length?inv.map(x=>`\u003cdiv class=\"li inv-li\">\u003cdiv style=\"flex:1;min-width:0\">\u003cb>${esc(x.name)}\u003c/b>\u003cdiv class=\"small muted\" style=\"overflow-wrap:anywhere\">${esc(x.email)} · ${ROLES[x.role]} · ${P(x.props[0]).name}\u003c/div>\u003cdiv class=\"small muted\">Invite email sent ${day(x.day)} (Sample)${(x.apps||[]).length?' · Opens '+(x.apps.map(k=>A(k).name).join(', ')):''}\u003c/div>\u003c/div>\u003cdiv class=\"inv-acts\">\u003cbutton type=\"button\" class=\"btn btn-outline\" data-k=\"resend-${x.id}\" data-resend=\"${x.id}\" aria-label=\"Resend invite to ${esc(x.name)}\">Resend\u003c/button>\u003cbutton type=\"button\" class=\"btn btn-danger\" data-k=\"cancelinv-${x.id}\" data-cancelinv=\"${x.id}\" aria-label=\"Cancel invite to ${esc(x.name)}\">Cancel invite\u003c/button>\u003cbutton type=\"button\" class=\"btn btn-outline\" data-k=\"accept-${x.id}\" data-accept=\"${x.id}\">Mark joined (demo)\u003c/button>\u003c/div>\u003c/div>`).join(''):'\u003cp class=\"small muted\" style=\"margin:8px 0 0\">No one is waiting.\u003c/p>'}\u003c/div>\u003c/div>`;\n const open=!u?`\u003cdiv class=\"card\" id=\"openAppsPanel\">\u003ch2 id=\"staffOpenH\">Open apps\u003c/h2>\u003cp class=\"small muted\">Invite staff first, then open apps for them here.\u003c/p>\u003c/div>`:\n  `\u003cdiv class=\"card\" id=\"openAppsPanel\">\u003ch2 id=\"staffOpenH\">Open apps\u003c/h2>\u003cp class=\"small muted\" style=\"margin:4px 0 10px\">Choose what ${esc(u.name)} can open. You can only turn on apps EasySpot has enabled for your company.\u003c/p>\n \u003cdiv class=\"field\">\u003clabel for=\"openUser\">Person\u003c/label>\u003cselect id=\"openUser\" data-k=\"open-user\">${people.map(p=>`\u003coption value=\"${p.id}\"${p.id===u.id?' selected':''}>${esc(p.name)} · ${ROLES[p.role]||'Not set up'}\u003c/option>`).join('')}\u003c/select>\u003c/div>\n ${APPS.map(a=>{const act=canGrantApp(a.k),why=grantBlockReason(a.k);\n   return `\u003cdiv class=\"card nested\" data-open-app=\"${a.k}\">\u003cdiv class=\"row\">\u003cspan class=\"mini-ic ic-${a.k}\">${ic(a.icon,18)}\u003c/span>\u003cdiv class=\"grow\">\u003ch3 class=\"h3\">${a.name}\u003c/h3>${act?'':'\u003cdiv class=\"small muted\">'+esc(why)+'\u003c/div>'}\u003c/div>\u003c/div>${act?`\u003cdiv class=\"stack\" style=\"margin-top:6px\">${PROPS.map(p=>{const on=!!grantFor(u.id,a.k,p.k),ass=u.props.includes(p.k);return `\u003cbutton type=\"button\" class=\"sw\" role=\"switch\" data-k=\"osw-${u.id}-${a.k}-${p.k}\" data-sw=\"${a.k}|${p.k}\" aria-checked=\"${on}\" ${ass?'':'disabled'}>\u003cspan class=\"trk\">\u003c/span>\u003cspan>${p.name}${ass?'':' · not assigned to this person'}\u003c/span>\u003c/button>`}).join('')}\u003c/div>`:''}\u003c/div>`}).join('')}\u003c/div>\n \u003cdiv class=\"card\">\u003ch2>Team\u003c/h2>\u003cdiv class=\"list\">${S.staff.filter(x=>x.st==='active').map(x=>`\u003cdiv class=\"li\">\u003cspan class=\"av\" aria-hidden=\"true\">${x.name.split(' ').map(c=>c[0]).join('')}\u003c/span>\u003cdiv style=\"flex:1;min-width:0\">\u003cb>${esc(x.name)}\u003c/b>\u003cdiv class=\"small muted\">${ROLES[x.role]||'Not set up'} · ${x.props.map(p=>P(p).name).join(', ')}\u003c/div>\u003c/div>${x.role!=='account_admin'?`\u003cbutton type=\"button\" class=\"btn btn-outline\" data-k=\"open-for-${x.id}\" data-openfor=\"${x.id}\" aria-label=\"Manage access for ${esc(x.name)}\">Manage access\u003c/button>`:''}\u003c/div>`).join('')}\u003c/div>\u003c/div>`;\n return `\u003ch1>Staff\u003c/h1>${pageCoSub()}\u003cp class=\"sub\">Add new staff, or open apps for someone already on your team. \u003cspan class=\"sample\">Sample\u003c/span>\u003c/p>\n \u003cdiv class=\"staff-flows\" role=\"tablist\" aria-label=\"Staff actions\">\u003cbutton type=\"button\" role=\"tab\" class=\"staff-flow\" id=\"staffAddTab\" data-k=\"staff-add\" data-staffflow=\"add\" aria-selected=\"${panel==='add'}\" aria-controls=\"staffPanel\" tabindex=\"${panel==='add'?0:-1}\">${ic('plus',16)}Add staff\u003c/button>\u003cbutton type=\"button\" role=\"tab\" class=\"staff-flow\" id=\"staffOpenTab\" data-k=\"staff-open\" data-staffflow=\"open\" aria-selected=\"${panel==='open'}\" aria-controls=\"staffPanel\" tabindex=\"${panel==='open'?0:-1}\">${ic('key-round',16)}Manage access\u003c/button>\u003c/div>\n \u003cdiv id=\"staffPanel\" role=\"tabpanel\" aria-labelledby=\"${panel==='add'?'staffAddTab':'staffOpenTab'}\">${panel==='add'?add:open}\u003c/div>`;\n}\n\nfunction notFoundView(){return `\u003cdiv class=\"full\" id=\"notFound\">\u003cspan class=\"e-ic\">${ic('search',30)}\u003c/span>\u003ch1>Not found\u003c/h1>\u003cp>We couldn't find that page in your workspace.\u003c/p>\u003cbutton type=\"button\" class=\"btn btn-primary\" data-k=\"back-hub\" data-go=\"hub\">Back to Hub\u003c/button>\u003c/div>`}\n\nfunction sidebarHTML(){\n const blocked=badRole();\n const pendApps=APPS.filter(a=>S.ent[a.k].st==='pending').length+S.reqs.filter(r=>reqViewSt(r)==='pending').length,inv=(S.invites||[]).length;\n const navBtn=(v,label,icn,cnt)=>`\u003cbutton type=\"button\" class=\"sb-item\" data-k=\"nav-${v}\" data-go=\"${v}\"${S.view===v||(v==='hub'&&S.view==='nf')?' aria-current=\"page\"':''}>${ic(icn,18)}\u003cspan>${label}\u003c/span>${cnt?`\u003cspan class=\"cnt\" aria-label=\"${cnt} waiting\">${cnt}\u003c/span>`:''}\u003c/button>`;\n return brandSide()+\n `${blocked?'':`\u003cdiv class=\"sb-ws\">\u003cspan class=\"k\">Account\u003c/span>\u003cspan class=\"v\">${esc(CLIENT_COMPANY)} \u003cspan class=\"sample\" style=\"color:#A9B5C9;border-color:#5B6B82\">Sample\u003c/span>\u003c/span>\u003clabel class=\"k\" for=\"propSel\">Building\u003c/label>\u003cselect id=\"propSel\" data-k=\"prop-sel\">\u003coption value=\"all\"${S.prop==='all'?' selected':''}>All buildings\u003c/option>${PROPS.map(p=>`\u003coption value=\"${p.k}\"${S.prop===p.k?' selected':''}>${p.name}\u003c/option>`).join('')}\u003c/select>\u003c/div>`}\n \u003cnav class=\"sb-nav\" aria-label=\"Main\">${blocked?'':navBtn('hub','Apps','layers')+`\u003cdiv class=\"sb-label\">Account admin\u003c/div>${navBtn('access','App access','shield-check',pendApps)}${navBtn('staff','Staff','users',inv)}`}\u003c/nav>`;\n}\n\nfunction render(){\n const root=$('#app');\n const keep=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;\n const caret=document.activeElement&&document.activeElement.id==='hdrSearch'?document.activeElement.selectionStart:null;\n if(S.session!=='ok'){drawerOpen=false;root.innerHTML=sessionHTML();return}\n ensureShell();\n $('#sidebar').innerHTML=sidebarHTML();\n paintTopbar();\n $('#offline').hidden=!S.offline;\n let v;\n if(badRole())v=blockerView();\n else if(S.view==='hub')v=hubView();\n else if(S.view==='access')v=accessView();\n else if(S.view==='staff')v=staffView();\n else if(S.view==='profile')v=profileView();\n else if(S.view==='settings')v=settingsView();\n else v=notFoundView();\n $('#main').innerHTML=v;$('#main').classList.toggle('wide',S.view==='hub'&&!badRole());uiSave();\n document.title=`${BRAND} · ${badRole()?'Hub':({hub:'Hub',access:'App access',staff:'Staff',profile:'Account profile',settings:'Settings'}[S.view]||'Not found')}`;\n if(keep&&!document.querySelector('.scrim')){const el=document.querySelector(`[data-k=\"${keep}\"]`);if(el&&el!==document.activeElement){el.focus({preventScroll:true});if(caret!=null&&el.setSelectionRange)el.setSelectionRange(caret,caret)}}\n}\n\nfunction addModal(pre,opener){\n const taken=k=>['pending','active'].includes(S.ent[k].st)||!catalogOn(k);\n let sel=pre&&!taken(pre)?pre:(APPS.find(a=>!taken(a.k))||{}).k||null;\n const m=openModal('addModal',`\u003ch2 id=\"addModal-t\">Add app\u003c/h2>\u003cp class=\"lead\">Pick an app from the ${esc(BRAND)} catalog. It shows on your Hub once it's approved.\u003c/p>\n \u003cdiv class=\"cat\" role=\"radiogroup\" aria-label=\"${esc(BRAND)} catalog\" id=\"cat\">${APPS.map(a=>`\u003cbutton type=\"button\" class=\"cat-opt\" role=\"radio\" data-cat=\"${a.k}\" aria-checked=\"${a.k===sel}\" ${taken(a.k)?'disabled':''} tabindex=\"${a.k===sel?0:-1}\">\u003cspan class=\"mini-ic ic-${a.k}\">${ic(a.icon,18)}\u003c/span>\u003cspan class=\"grow\">\u003cb>${a.name}\u003c/b>\u003cspan>${taken(a.k)?(!catalogOn(a.k)?'Not available':S.ent[a.k].st==='pending'?'Already pending approval':'Already on your Hub'):a.desc}\u003c/span>\u003c/span>\u003c/button>`).join('')}\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"adProp\">First building\u003c/label>\u003cselect id=\"adProp\">${PROPS.map(p=>`\u003coption value=\"${p.k}\">${p.name}\u003c/option>`).join('')}\u003c/select>\u003cspan class=\"help\">From your onboarding (Sample). You can give access to more buildings later.\u003c/span>\u003c/div>\n \u003cdiv class=\"acts-col sticky-acts\">\u003cbutton type=\"button\" class=\"btn btn-primary btn-block\" id=\"adSubmit\" ${sel?'':'disabled'}>Add app\u003c/button>${sel?'':'\u003cp class=\"why\">All catalog apps are already added.\u003c/p>'}\u003cbutton type=\"button\" class=\"btn btn-outline btn-block\" data-close>Cancel\u003c/button>\u003c/div>`,{opener,focus:sel?`[data-cat=\"${sel}\"]`:'#adSubmit'});\n const opts=[...m.querySelectorAll('.cat-opt:not(:disabled)')];\n const pick=k=>{sel=k;m.querySelectorAll('.cat-opt').forEach(b=>{b.setAttribute('aria-checked',b.dataset.cat===k);b.tabIndex=b.dataset.cat===k?0:-1})};\n opts.forEach(b=>{b.onclick=()=>pick(b.dataset.cat);b.onkeydown=e=>{if(['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();const i=opts.indexOf(b),d=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;const n=opts[(i+d+opts.length)%opts.length];pick(n.dataset.cat);n.focus()}}});\n m.querySelector('#adSubmit').onclick=()=>{if(!sel)return;S.ent[sel]={st:'pending',prop:m.querySelector('#adProp').value,day:S.now};note(`${A(sel).name} is pending approval.`);pushShared();const name=A(sel).name;S.tab='all';closeModal({noReturn:true});S.view='hub';render();live(`${name} added. It's pending approval.`);const t=document.querySelector(`[data-k=\"tile-${sel}\"]`);(t||$('#main')).focus()};\n}\n/* Ask EasySpot (the admin console) to turn an app on for the company. */\nfunction enableReqModal(k,opener){\n const a=A(k);\n const m=openModal('enableModal',`\u003ch2 id=\"enableModal-t\">Ask EasySpot for ${a.name}\u003c/h2>\u003cp class=\"lead\">EasySpot reviews your request and turns the app on for ${esc(CLIENT_COMPANY)}. It stays open for ${reqTtl({kind:'enable'})} days.\u003c/p>\n \u003cdiv class=\"field\">\u003clabel for=\"enReason\">What do you need it for?\u003c/label>\u003ctextarea id=\"enReason\" aria-describedby=\"enHelp enErr\" placeholder=\"For example: we want to plan community events at our buildings\">\u003c/textarea>\u003cspan class=\"help\" id=\"enHelp\">At least 10 c }\n               HubContract.backUrl(ctx, info)      -> where \"Back to Hub\" goes\n               HubContract.notifyHub(ctx, note)    -> put a line under the Hub bell\n               HubContract.signedOut(userId)       -> true once the Hub signed the user out */\n(function(root){\n const VERSION=1;\n const FIELDS=['app','companyId','company','propertyId','propertyKey','property','role','userId','user','theme','locale','dateFormat','timeZone','returnUrl'];\n const REQUIRED=['app','companyId','role','userId','returnUrl'];\n const RETURN_MARK='#hub-return=';\n const CHANNEL='ea-store';\n\n /* Only ever go back to a page on this origin: no open redirects, no script URLs. */\n function safeUrl(u,base,hubOrigins){\n  try{\n   const here=new URL(base||root.location.href),x=new URL(String(u),here);\n   if(!/^(https?|file):$/.test(x.protocol))return null;\n   if(x.protocol===here.protocol&&x.host===here.host)return x.href;\n   /* An app on another site lists the Hub origins it trusts, e.g. ['https://hub.example.com']. */\n   return x.protocol==='https:'&&Array.isArray(hubOrigins)&&hubOrigins.indexOf(x.origin)>=0?x.href:null;\n  }catch(e){return null}\n }\n\n function build(launch,ctx,base){\n  const u=new URL(launch.url,base||root.location.href);\n  u.searchParams.set('hub',String(VERSION));\n  (launch.params||FIELDS).forEach(k=>{if(ctx[k]!=null&&ctx[k]!=='')u.searchParams.set(k,String(ctx[k]))});\n  return u.href;\n }\n\n function read(search,opts){\n  const o=opts||{},q=new URLSearchParams(search==null?root.location.search:search),ctx={},errors=[];\n  if(q.get('hub')!==String(VERSION))errors.push('hub');\n  FIELDS.forEach(k=>{const v=q.get(k);if(v!=null&&v!=='')ctx[k]=v});\n  REQUIRED.concat(o.require||[]).forEach(k=>{if(!ctx[k])errors.push(k)});\n  if(ctx.returnUrl){const s=safeUrl(ctx.returnUrl,o.base,o.hubOrigins);if(s)ctx.returnUrl=s;else{delete ctx.returnUrl;if(errors.indexOf('returnUrl')\u003c0)errors.push('returnUrl')}}\n  if(ctx.theme!=='dark'&&ctx.theme!=='light rs.push('app');\n  return {ok:!errors.length,ctx,errors};\n }\n\n function backUrl(ctx,info,opts){\n  const base=ctx&&ctx.returnUrl?safeUrl(ctx.returnUrl,null,opts&&opts.hubOrigins):null;\n  if(!base)return null;\n  const payload=Object.assign({app:ctx.app},info||{});\n  return base.split('#')[0]+RETURN_MARK+encodeURIComponent(JSON.stringify(payload));\n }\n\n function parseReturn(hash){\n  const h=String(hash==null?root.location.hash:hash);\n  if(h.indexOf(RETURN_MARK)!==0)return null;\n  try{\n   const o=JSON.parse(decodeURIComponent(h.slice(RETURN_MARK.length)));\n   if(!o||typeof o!=='object'||typeof o.app!=='string')return null;\n   return {app:o.app.slice(0,40),event:typeof o.event==='string'?o.event.slice(0,40):'',message:typeof o.message==='string'?o.message.slice(0,200):''};\n  }catch(e){return null}\n }\n\n /* Notes live in the same store the Hub syncs: ea:notes:\u003ctopic>:\u003csender>. */\n function notifyHub(ctx,note){\n  if(!ctx||!ctx.userId||!ctx.app||!note||!note.text)return false;\n  const key='ea:notes:'+ctx.userId+':app_'+ctx.app,t=Date.now();\n  let items=[];\n  try{const cur=JSON.parse(root.localStorage.getItem(key)||'null');if(cur&&cur.v===1&&Array.isArray(cur.items))items=cur.items}catch(e){}\n  items=[{id:'app_'+ctx.app+'-'+t,type:note.type||'apps',text:String(note.text).slice(0,200),app:ctx.app}].concat(items).slice(0,20);\n  const val={v:1,items,_t:t};\n  try{root.localStorage.setItem(key,JSON.stringify(val))}catch(e){return false}\n  try{const ch=new BroadcastChannel(CHANNEL);ch.postMessage({from:'app',key,val});ch.close()}catch(e){}\n  return true;\n }\n\n function sessionKey(userId){return 'ea-session:'+userId}\n function signedOut(userId){\n  try{const o=JSON.parse(root.localStorage.getItem(sessionKey(userId))||'null');return !!(o&&o.out&&(!o.in||o.out>o.in))}catch(e){return false}\n }\n function markSession(userId,what){\n  try{const k=sessionKey(userId),o=JSON.parse(root.localStorage.getItem(k)||'null')||{};o[what]=Date.now();root.l
