x)===i).slice(0,200)))}catch(e){}\n $('#notesSettings').onclick=()=>{closeModal({noReturn:true});openSettingsSection('notifications')};\n}\n\nfunction helpModal(opener){\n const items=typeof helpItems==='function'?helpItems():[];\n const m=openModal('helpModal',`\u003ch2 id=\"helpModal-t\">Help and contact\u003c/h2>\u003cp class=\"lead\">We're here to help you get the most from your EasySpot apps.\u003c/p>\n \u003cdiv class=\"list\" style=\"margin-top:8px\">${items.map(([t,d])=>`\u003cdiv class=\"li\">\u003cdiv>\u003cb>${t}\u003c/b>\u003cdiv class=\"small muted\">${d}\u003c/div>\u003c/div>\u003c/div>`).join('')}\u003c/div>\n \u003cdiv class=\"field\">\u003clabel for=\"hpMsg\">Message EasySpot support\u003c/label>\u003ctextarea id=\"hpMsg\" aria-describedby=\"hpHelp hpErr\" placeholder=\"Tell us what you need help with\">\u003c/textarea>\u003cspan class=\"help\" id=\"hpHelp\">Demo only: nothing is sent (Sample).\u003c/span>\u003cdiv class=\"err\" id=\"hpErr\" hidden>\u003c/div>\u003c/div>\n \u003cdiv class=\"acts-col sticky-acts\">\u003cbutton type=\"button\" class=\"btn btn-primary btn-block\" id=\"hpSend\">Send message\u003c/button>\u003cbutton type=\"button\" class=\"btn btn-outline btn-block\" data-close>Close\u003c/button>\u003c/div>`,{opener});\n m.querySelector('#hpSend').onclick=()=>{const v=m.querySelector('#hpMsg');if(v.value.trim().length\u003c3){const e=m.querySelector('#hpErr');e.hidden=false;e.innerHTML=`${ic('circle-alert',15)}\u003cspan>Please write a short message first.\u003c/span>`;v.classList.add('is-err');v.setAttribute('aria-invalid','true');v.focus();return}closeModal();live('Message saved in this demo. Nothing was sent.')};\n}\n\nfunction handleChromeClick(t){\n if(t.matches('[data-close]')){closeModal();return true}\n if(t.id==='signIn'){HubContract.markSession(me().id,'out');HubContract.go('index','login');return true}\n if(t.id==='demoBtn'){closeAv(false);demoModal($('#avBtn'));return true}\n if(t.id==='menuBtn'){openDrawer();return true}\n if(t.id==='sbClose'||t.id==='sbScrim'){closeDrawer();return true}\n if(t.id==='themeBtn'){setTheme(theme==='dark'?'light':'dark');render();$('#themeBtn').focus();return true}\n if(t.id==='bellBtn'){notesModal();return true}\n if(t.id==='helpBtn'){helpModal(t);return true}\n if(t.id==='avBtn'){if($('#avPop').hidden)openAv();else closeAv(false);return true}\n if(t.id==='miProfile'){closeAv(false);go('profile');return true}\n if(t.id==='miSettings'){closeAv(false);go('settings');return true}\n if(settingsClick(t))return true;\n if(t.id==='blkSignout'){signOut();return true}\n if(t.id==='miSignout'){closeAv(false);closeDrawer(false);signOut();return true}\n if(t.dataset.go){go(t.dataset.go);return true}\n return false;\n}\n\nfunction bindChrome(){\n document.addEventListener('click',e=>{\n  if(e.target.id==='sbScrim'){closeDrawer();return}\n  if(!e.target.closest('#hdrAcct'))closeAv(false);\n  const t=e.target.closest('button,[data-close]');\n  if(!t)return;\n  if(handleChromeClick(t))return;\n  if(typeof handleRoleClick==='function')handleRoleClick(t);\n });\n document.addEventListener('keydown',e=>{\n  if(e.key==='Escape'){if(modalStack.length){e.preventDefault();closeModal();return}const mn=$('#avPop');if(mn&&!mn.hidden){closeAv(true);return}if(drawerOpen){closeDrawer();return}}\n  if(e.key==='Tab'){\n   let c=modalStack.length?$('#'+modalStack.at(-1).id):(drawerOpen?$('#sidebar'):null);\n   if(c){const f=focusables(c);if(!f.length)return;const i=f.indexOf(document.activeElement);\n    if(e.shiftKey&&(i\u003c=0)){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&(i===f.length-1||i===-1)){e.preventDefault();f[0].focus()}}\n   const mn=$('#avPop');if(mn&&!mn.hidden&&!modalStack.length&&mn.contains(document.activeElement))closeAv(false)}\n  const g=e.target.closest&&e.target.closest('.seg[role=radiogroup],[role=tablist]');\n  if(g&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const bs=[...g.querySelectorAll('button')];const i=bs.indexOf(e.target);const n=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[n].click();const nb=document.querySelector(`[data-k=\"${bs[n].dataset.k}\"]`)||bs[n];nb.focus()}\n  const mi=e.target.closest&&e.target.closest('#avMenu');\n  if(mi&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const bs=[...mi.querySelectorAll('[role=menuitem]')];const i=bs.indexOf(e.target);const n=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[n].focus()}\n  if(e.target.id==='avBtn'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openAv(e.key==='ArrowUp')}\n });\n matchMedia('(min-width:1024px)').addEventListener('change',()=>{if(isDesk())closeDrawer(false)});\n addEventListener('offline',()=>{S.offline=true;render()});addEventListener('online',()=>{S.offline=false;render()});\n bindSearch();\n}\n\n/* What the person was looking at survives a trip into an app and back (per tab, per role). */\nconst UI_KEYS=['view','tab','prop','now','accessTab','staffPanel','matrixUser','client'];\nfunction uiKey(){return 'ea-hub-ui:'+storeRole()}\nfunction uiSave(){try{const o={};UI_KEYS.forEach(k=>{if(S[k]!==undefined&&S[k]!==null)o[k]=S[k]});sessionStorage.setItem(uiKey(),JSON.stringify(o))}catch(e){}}\nfunction uiRestore(){let o=null;try{o=JSON.parse(sessionStorage.getItem(uiKey())||'null')}catch(e){}if(!o||typeof o!=='object')return false;UI_KEYS.forEach(k=>{if(o[k]!==undefined&&k in S&&(S[k]===null||typeof o[k]===typeof S[k]))S[k]=o[k]});if(S.view==='nf')S.view=S.homeView;return true}\n/* Nobody gets a workspace without signing in at the front door (index.html). Returns false when leaving. */\nfunction bootSession(){let rec=null;try{rec=localStorage.getItem(HubContract.sessionKey(me().id))}catch(e){}if(rec&&!HubContract.signedOut(me().id))return true;S.session='out';HubContract.go('index','login');return false}\n\u003c/script>\n\u003cscript>\nconst ROLES={internal_admin:'Internal admin',unset:'Not set up'};\nconst ST={active:['Active','c-open','circle-check'],setup:['Setup in progress','c-pending','clock'],paused:['Paused','c-locked','lock']};\nconst PROFILE_INTRO='Your details in this console.';\nconst SIGNOUT_LINE=\"You're signed out of EasySpot and every EasySpot app.\";\nconst hideProfileAsk=u=>u.role==='internal_admin'||u.role==='account_admin';\nconst backClients=()=>`\u003cbutton type=\"button\" class=\"btn btn-outline back-btn\" data-k=\"back-clients\" data-go=\"clients\">${ic('arrow-left',16)}Back to Clients\u003c/button>`;\nconst ADMIN_CLIENTS='ea:admin:clients';\nconst ADMIN_ENABLE='ea:admin:enable:'+AMC_ID;\nconst AMC_APPS='ea:cli_001:apps';\nconst AMC_ENABLE_OUT='ea:cli_001:enable_out';\nconst STORE_ROLE='admin';\nconst NOTE_SELF='admin';\nconst NOTE_TOPICS=()=>['admin'];\nconst STORE_FROM=()=>({[ADMIN_CLIENTS]:['admin'],[ADMIN_ENABLE]:['admin'],[AMC_APPS]:['admin'],[SYS_KEY]:['admin'],[AMC_ENABLE_OUT]:['client'],'ea:notes:admin:*':['client']});\nconst STORE_WRITE=()=>[ADMIN_CLIENTS,ADMIN_ENABLE,AMC_APPS,SYS_KEY,'ea:notes:admin:admin','ea:notes:cli_001:admin','ea:notes:cli_001.admins:admin','ea:notes:all:admin'];\nconst STORE_READ=()=>[ADMIN_CLIENTS,ADMIN_ENABLE,AMC_APPS,SYS_KEY,AMC_ENABLE_OUT,'ea:notes:admin:*'];\nconst REQ_TTL=()=>sysConfig().enableTtlDays;\nconst OTHER_IDS=['cli_002','cli_003','cli_004'];\nconst ENABLE_REASONS={req_001:'We would like EasySpotEvents for community gatherings at our buildings.',req_002:'Please turn EasySpotOps back on so we can start work again.'};\nconst CLIENTS_META={\n cli_001:{name:'AMC LLC',email:'hello@amcllc.sample',contact:'Daniel Okafor'},\n cli_002:{name:'Harbor & Pine Co',email:'hello@harborpine.sample',contact:'Elena Ruiz'},\n cli_003:{name:'Northstar Properties',email:'hello@northstarprops.sample',contact:'James Okonkwo'},\n cli_004:{name:'Willow Bend Group',email:'hello@willowbend.sample',contact:'Sofia Berg'}\n};\nconst fresh=()=>({\n session:'ok',view:'clients',homeView:'clients',client:null,q:'',now:0,offline:false,\n me:{id:'u_010',name:'Priya Shah',email:'priya.shah@easyspot.sample',role:'internal_admin',company:'EasySpot'},\n clients:[],\n reqs:[]});\nlet S=fresh();\nconst me=()=>S.me;\nconst badRole=()=>!ROLES[me().role]||me().role==='unset';\nconst C=id=>S.clients.find(c=>c.id===id);\nfunction appsOn(c){return APPS.filter(a=>c.apps[a.k]).length}\nfunction pendReq(c){return S.reqs.filter(r=>r.client===c.id&&reqViewSt(r)==='pending').length}\n\nwindow.__events=window.__events||[];\nconst DEBUG=()=>{try{return new URLSearchParams(location.search).has('debug')||location.hash==='#debug'}catch(e){return false}};\nlet evSeen=new Set();\nfunction track(ev){\n const allowed=new Set(['event','admin_user_id','client_id','app_id','request_id','request_status','enabled']);\n const clean={};for(const k of Object.keys(ev))if(allowed.has(k)&&ev[k]!=null)clean[k]=ev[k];\n const key=Object.keys(clean).sort().map(k=>k+':'+clean[k]).join('|');\n if(clean.event==='client_view'&&evSeen.has(key))return;\n if(clean.event==='client_view')evSeen.add(key);\n window.__events.push(clean);\n if(DEBUG()){try{console.log('[event]',JSON.stringify(clean))}catch(e){}}\n}\nfunction emitClientView(id){track({event:'client_view',admin_user_id:me().id,client_id:id})}\nfunction emitToggle(cid,app,on){track({event:'app_toggle',admin_user_id:me().id,client_id:cid,app_id:app,enabled:!!on})}\nfunction emitReview(id,cid,st){track({event:'request_review',admin_user_id:me().id,client_id:cid,request_id:id,request_status:st})}\n\nfunction profileExtraRows(u,row){return row('Scope','All clients')}\n\nfunction validEnableReqs(arr){if(!Array.isArray(arr))return [];return arr.filter(r=>r&&typeof r==='object'&&/^req_\\d+$/.test(r.id)&&APP_KEYS.includes(r.app)&&['pending','approved','denied','expired'].includes(r.st)&&typeof r.day==='number').map(r=>({id:r.id,app:r.app,st:r.st,day:r.day}))}\nfunction validateAdminClients(o){if(!o||o.v!==1||!o.clients||typeof o.clients!=='object')return null;const out={v:1,clients:{}};OTHER_IDS.forEach(id=>{const c=o.clients[id];if(!c)return;const apps=validApps(c.apps);if(!apps)return;const st=['active','setup','paused'].includes(c.st)?c.st:'active';out.clients[id]={st,apps,reqs:validEnableReqs(c.reqs)}});return out}\nfunction validateAmcApps(o){if(!o||o.v!==1)return null;const apps=validApps(o.apps);if(!apps)return null;const st=['active','setup','paused'].includes(o.st)?o.st:'active';return {v:1,st,apps}}\nfunction seedAdminClients(){return {v:1,clients:{cli_002:{st:'active',apps:{ops:true,home:true,evt:true,fin:true},reqs:[]},cli_003:{st:'setup',apps:{ops:true,home:false,evt:false,fin:false},reqs:[]},cli_004:{st:'paused',apps:{ops:false,home:false,evt:false,fin:false},reqs:[{id:'req_002',app:'ops',st:'pending',day:-2}]}}}}\nfunction seedAmcApps(){return {v:1,st:'active',apps:defaultApps()}}\nfunction seedAmcEnable(){return {v:1,reqs:[{id:'req_001',app:'evt',st:'pending',day:0}]}}\nfunction seedStores(){if(!storeGet(ADMIN_CLIENTS))storeSet(ADMIN_CLIENTS,seedAdminClients());if(!storeGet(AMC_APPS))storeSet(AMC_APPS,seedAmcApps());if(!storeGet(ADMIN_ENABLE))storeSet(ADMIN_ENABLE,seedAmcEnable())}\nfunction applyShared(){\n const others=validateAdminClients(storeGet(ADMIN_CLIENTS))||{v:1,clients:{}};\n const amc=validateAmcApps(storeGet(AMC_APPS))||seedAmcApps();\n const rawIn=storeGet(ADMIN_ENABLE);\n const inbox={v:1,reqs:rawIn&&rawIn.v===1?validEnableReqs(rawIn.reqs):[]};\n const pack=(id,st,apps)=>{const meta=CLIENTS_META[id]||{name:id,email:'',contact:''};return {id,name:meta.name,email:meta.email,contact:meta.contact,st,apps}}\n S.clients=[pack(AMC_ID,amc.st,amc.apps)].concat(OTHER_IDS.map(id=>{const c=others.clients[id];return c?pack(id,c.st,c.apps):null}).filter(Boolean));\n S.reqs=inbox.reqs.map(r=>Object.assign({client:AMC_ID,reason:ENABLE_REASONS[r.id]||''},r));\n OTHER_IDS.forEach(id=>{(others.clients[id]&&others.clients[id].reqs||[]).forEach(r=>S.reqs.push(Object.assign({client:id,reason:ENABLE_REASONS[r.id]||''},r)))});\n /* Requests the client sent from its Hub land in the same inbox. */\n const eo=storeGet(AMC_ENABLE_OUT);\n (eo&&eo.v===1&&Array.isArray(eo.reqs)?eo.reqs:[]).forEach(r=>{\n  if(!r||!/^req_\\d+$/.test(r.id)||!APP_KEYS.includes(r.app)||typeof r.day!=='number')return;\n  const reason=String(r.reason||'').slice(0,300),have=S.reqs.find(x=>x.id===r.id);\n  if(have){if(have.client===AMC_ID&&!have.reason)have.reason=reason}\n  else S.reqs.push({client:AMC_ID,id:r.id,app:r.app,st:'pending',day:r.day,reason})});\n}\nfunction collectShared(){\n const amc=C(AMC_ID);if(amc)storeSet(AMC_APPS,{v:1,st:amc.st,apps:Object.assign({},amc.apps)});\n const others={v:1,clients:{}};\n OTHER_IDS.forEach(id=>{const c=C(id);if(!c)return;others.clients[id]={st:c.st,apps:Object.assign({},c.apps),reqs:S.reqs.filter(r=>r.client===id).map(r=>({id:r.id,app:r.app,st:r.st,day:r.day}))}});\n storeSet(ADMIN_CLIENTS,others);\n storeSet(ADMIN_ENABLE,{v:1,reqs:S.reqs.filter(r=>r.client===AMC_ID).map(r=>({id:r.id,app:r.app,st:r.st,day:r.day}))});\n}\nfunction resetAdminStores(){storeSet(ADMIN_CLIENTS,seedAdminClients());storeSet(AMC_APPS,seedAmcApps());storeSet(ADMIN_ENABLE,seedAmcEnable());storeSet(SYS_KEY,SYS_DEFAULT());applyShared()}\n\nfunction clientsView(){\n const list=S.clients.slice();\n let h=`\u003cdiv class=\"hub-head\">\u003cdiv>\u003ch1>Clients\u003c/h1>\u003cp class=\"sub\">\u003cspan>Companies that use EasySpot apps\u003c/span>\u003cspan class=\"sample\">Sample\u003c/span>\u003c/p>\u003c/div>\u003c/div>`;\n if(!list.length)return h+`\u003cdiv class=\"empty\" id=\"noMatch\">\u003cspan class=\"e-ic\">${ic('search',22)}\u003c/span>\u003cp>No clients to show yet.\u003c/p>\u003c/div>`;\n h+=`\u003cdiv class=\"stack\" style=\"margin-top:8px\">${list.map(c=>{\n  const st=ST[c.st];\n  return `\u003cbutton type=\"button\" class=\"card row cli-row\" data-k=\"cli-${c.id}\" data-client=\"${c.id}\" style=\"width:100%;text-align:left;cursor:pointer\">\u003cdiv class=\"grow\">\u003ch2 class=\"h3\">${esc(c.name)}\u003c/h2>\u003cdiv class=\"small muted\">${esc(c.contact)} · \u003cspan style=\"overflow-wrap:anywhere\">${esc(c.email)}\u003c/span>\u003c/div>\u003cdiv class=\"cli-meta\">\u003cspan class=\"chip ${st[1]}\">${ic(st[2],13)}${st[0]}\u003c/span>\u003cspan class=\"small muted\">${appsOn(c)} app${appsOn(c)===1?'':'s'} on\u003c/span>${pendReq(c)?`\u003cspan class=\"chip c-pending\">${ic('clock',13)}${pendReq(c)} pending\u003c/span>`:''}\u003c/div>\u003c/div>\u003c/button>`;\n }).join('')}\u003c/div>`;\n return h;}\n\nfunction clientDetailView(){\n const c=C(S.client);if(!c)return notFoundView();\n emitClientView(c.id);\n const st=ST[c.st];\n const reqs=S.reqs.filter(r=>r.client===c.id).sort((a,b)=>b.day-a.day||b.id.localeCompare(a.id));\n let h=`\u003cdiv class=\"page-narrow\">${backClients()}\n \u003ch1 style=\"margin-top:12px\">${esc(c.name)}\u003c/h1>\u003cp class=\"sub\">\u003cspan class=\"chip ${st[1]}\">${ic(st[2],13)}${st[0]}\u003c/span> \u003cspan class=\"sample\">Sample\u003c/span>\u003c/p>\n \u003cdiv class=\"card\" style=\"margin-top:12px\">\u003cdiv class=\"list\">\u003cdiv class=\"li\">\u003cspan class=\"muted pf-k\">Contact\u003c/span>\u003cspan class=\"pf-v\">${esc(c.contact)}\u003c/span>\u003c/div>\u003cdiv class=\"li\">\u003cspan class=\"muted pf-k\">Email\u003c/span>\u003cspan class=\"pf-v\" style=\"overflow-wrap:anywhere\">${esc(c.email)}\u003c/span>\u003c/div>\u003cdiv class=\"li\">\u003cspan class=\"muted pf-k\">Status\u003c/span>\u003cspan class=\"pf-v\">${st[0]}\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n \u003cdiv class=\"card\" style=\"margin-top:12px\">\u003ch2 class=\"h3\">Apps\u003c/h2>\u003cp class=\"small muted\" style=\"margin:4px 0 8px\">Turn an app on or off for this client. Nothing is sent (Sample).\u003c/p>\u003cdiv class=\"stack\">${APPS.map(a=>`\u003cbutton type=\"button\" class=\"sw\" role=\"switch\" data-k=\"sw-${c.id}-${a.k}\" data-tog=\"${c.id}|${a.k}\" aria-checked=\"${!!c.apps[a.k]}\">\u003cspan class=\"trk\">\u003c/span>\u003cspan>\u003cb style=\"font-weight:600\">${a.name}\u003c/b>\u003cspan class=\"small muted\" style=\"display:block\">${a.desc}\u003c/span>\u003c/span>\u003c/button>`).join('')}\u003c/div>\u003c/div>\n \u003cdiv class=\"card req-card\">\u003ch2 class=\"h3\">Requests\u003c/h2>`;\n if(!reqs.length)h+=`\u003cp class=\"small muted\" style=\"margin:8px 0 0\" id=\"noReqs\">No requests from this client.\u003c/p>`;\n h+=reqs.map(r=>{const vs=reqViewSt(r);const rs=REQ_STATE[vs],rst=[rs.chip,rs.icon,rs.label];\n  return `\u003cdiv class=\"card\" style=\"margin-top:10px;box-shadow:none\" data-req-row=\"${r.id}\">\u003cdiv class=\"row\">\u003cspan class=\"mini-ic ic-${r.app}\">${ic(A(r.app).icon,18)}\u003c/span>\u003cdiv class=\"grow\">\u003ch2 class=\"h3\">${A(r.app).name}\u003c/h2>\u003cdiv class=\"small muted\">Asked ${day(r.day)} (Sample)\u003c/div>\u003c/div>\u003cspan class=\"chip ${rst[0]}\">${ic(rst[1],13)}${rst[2]}\u003c/span>\u003c/div>${r.reason?`\u003cp class=\"small\" style=\"margin:8px 0 0\">“${esc(r.reason)}”\u003c/p>`:''}${vs==='pending'?`\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cdiv class=\"acts\">\u003cbutton type=\"button\" class=\"btn btn-primary\" data-k=\"rq-ok-${r.id}\" data-rqok=\"${r.id}\">${ic('check',16)}Approve\u003c/button>\u003cbutton type=\"button\" class=\"btn btn-danger\" data-k=\"rq-no-${r.id}\" data-rqno=\"${r.id}\">Don't approve\u003c/button>\u003c/div>\u003c/div>`:''}\u003c/div>`}).join('');\n return h+'\u003c/div>\u003c/div>';\n}\n\nfunction notFoundView(){return `\u003cdiv class=\"full\" id=\"notFound\">\u003cspan class=\"e-ic\">${ic('search',30)}\u003c/span>\u003ch1>Not found\u003c/h1>\u003cp>We couldn't find that page.\u003c/p>\u003cbutton type=\"button\" class=\"btn btn-primary\" data-k=\"back-clients\" data-go=\"clients\">Back to Clients\u003c/button>\u003c/div>`}\n\nfunction sidebarHTML(){\n const blocked=badRole();\n const waiting=S.reqs.filter(r=>reqViewSt(r)==='pending').length;\n const navBtn=(v,label,icn,cnt)=>`\u003cbutton type=\"button\" class=\"sb-item\" data-k=\"nav-${v}\" data-go=\"${v}\"${S.view===v||(v==='clients'&&S.view==='client')?' aria-current=\"page\"':''}>${ic(icn,18)}\u003cspan>${label}\u003c/span>${cnt?`\u003cspan class=\"cnt\" aria-label=\"${cnt} pending\">${cnt}\u003c/span>`:''}\u003c/button>`;\n return brandSide('Admin')+\n `${blocked?'':`\u003cdiv class=\"sb-ws\">\u003cspan class=\"k\">Signed in as\u003c/span>\u003cspan class=\"v\">${esc(me().name)} \u003cspan class=\"sample\" style=\"color:#A9B5C9;border-color:#5B6B82\">Sample\u003c/span>\u003c/span>\u003c/div>`}\n \u003cnav class=\"sb-nav\" aria-label=\"Main\">${blocked?'':navBtn('clients','Clients','layers',waiting)+`\u003cdiv class=\"sb-label\">Apps\u003c/div>`+APP_REGISTRY.filter(a=>a.launch.urlByRole&&a.launch.urlByRole[me().role]).map(a=>`\u003cbutton type=\"button\" class=\"sb-item\" data-k=\"open-${a.id}\" data-openapp=\"${a.id}\">${ic(a.icon,18)}\u003cspan>${a.name} admin\u003c/span>\u003cspan class=\"sr-only\"> (opens in a new tab)\u003c/span>\u003c/button>`).join('')}\u003c/nav>`;\n}\n\nfunction render(){\n const root=$('#app');\n const keep=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.k:null;\n const caret=document.activeElement&&document.activeElement.id==='hdrSearch'?document.activeElement.selectionStart:null;\n if(S.session!=='ok'){drawerOpen=false;root.innerHTML=sessionHTML();return}\n ensureShell();\n $('#sidebar').innerHTML=sidebarHTML();\n paintTopbar();\n $('#offline').hidden=!S.offline;\n let v;\n if(badRole())v=blockerView();\n else if(S.view==='clients')v=clientsView();\n else if(S.view==='client')v=clientDetailView();\n else if(S.view==='profile')v=profileView(backClients());\n else if(S.view==='settings')v=settingsView(backClients());\n else v=notFoundView();\n $('#main').innerHTML=v;uiSave();\n document.title=`${BRAND} · ${badRole()?'Admin':({clients:'Clients',client:(C(S.client)||{}).name||'Client',pro pr',`EasySpot did not approve ${A(r.app).name} for your company.`);live(`${A(r.app).name} not approved.`);emitReview(r.id,r.client,'not_approved')}\n  pushShared();render();const focus=$('[data-k=\"nav-clients\"]');focus&&focus.blur();return}\n}\n\n\nbindChrome();\n\nfunction searchIndex(){\n const apps=APP_REGISTRY.map(a=>({key:a.id,label:a.name,terms:a.category+' '+a.keywords+' availability lifecycle',run:()=>openSettingsSection('org')}));\n const people=(S.clients||[]).filter(c=>c.contact).map(c=>({key:'p-'+c.id,label:c.contact,run:()=>{S.view='client';S.client=c.id;render();const m=$('#main');m&&m.focus()}}));\n const clients=(S.clients||[]).map(c=>({key:'c-'+c.id,label:c.name,run:()=>{S.view='client';S.client=c.id;render();const m=$('#main');m&&m.focus()}}));\n const pages=[\n  {key:'clients',label:'Clients',terms:'companies accounts',run:()=>go('clients')},\n  {key:'profile',label:'Account profile',run:()=>go('profile')},\n  {key:'settings',label:'Settings',run:()=>go('settings')}\n ];\n return {apps,buildings:[],people,clients,pages,settings:searchSettingsItems()};\n}\n\n/* System settings: what every company's Hub sees. */\nconst LC_NOTE={live:n=>`${n} is ready to open.`,beta:n=>`${n} is open in beta.`,coming_soon:n=>`${n} is not open yet. It is coming soon.`,maintenance:n=>`${n} is down for maintenance.`};\nfunction settingsOrgHTML(head){\n const sys=sysConfig(),opt=(list,cur)=>list.map(([v,l])=>`\u003coption value=\"${v}\"${String(cur)===String(v)?' selected':''}>${l}\u003c/option>`).join('');\n return `\u003cdiv class=\"card\">${head('org','System')}\u003cp class=\"small muted\" style=\"margin:4px 0 0\">These apply to every client's Hub straight away.\u003c/p>\n \u003ch3 class=\"h3\" style=\"margin-top:14px\">App availability\u003c/h3>\n ${APP_REGISTRY.map(a=>`\u003cdiv class=\"field\">\u003clabel for=\"sys-lc-${a.id}\">${a.name}\u003c/label>\u003cselect id=\"sys-lc-${a.id}\" data-k=\"sys-lc-${a.id}\" data-setorg=\"lc:${a.id}\"${lifecycleChoices(a.id).length\u003c3?` aria-describedby=\"sys-lch-${a.id}\"`:''}>${opt(lifecycleChoices(a.id).map(v=>[v,LIFECYCLE[v].label]),appLifecycle(a.id))}\u003c/select>${lifecycleChoices(a.id).length\u003c3?`\u003cspan class=\"help\" id=\"sys-lch-${a.id}\">No destination is registered for this app yet, so it can't go live.\u003c/span>`:''}\u003c/div>`).join('')}\n \u003ch3 class=\"h3\" style=\"margin-top:16px\">Client requests\u003c/h3>\n \u003cdiv class=\"field\">\u003clabel for=\"sysTtl\">A client's request to turn an app on stays open for\u003c/label>\u003cselect id=\"sysTtl\" data-k=\"sys-ttl\" data-setorg=\"ttl\">${opt([[7,'7 days'],[14,'14 days'],[30,'30 days']],sys.enableTtlDays)}\u003c/select>\u003c/div>\u003c/div>`;\n}\nfunction settingsOrgChange(key,val){\n const sys=sysConfig();\n if(key==='ttl'){if(![7,14,30].includes(+val))return;sys.enableTtlDays=+val}\n else if(key.indexOf('lc:')===0){const id=key.slice(3);if(!appDef(id)||!lifecycleChoices(id).includes(val)||appLifecycle(id)===val)return;sys.lifecycle[id]=val;notify('all','apps',LC_NOTE[val](appDef(id).name),{app:id,ready:val==='live'||val==='beta'});note(`${appDef(id).name} set to ${LIFECYCLE[val].label} for everyone.`,'apps')}\n else return;\n storeSet(SYS_KEY,sys);settingsSaved=true;render();live('Saved for every Hub.');\n}\n\nsettingsInit(me().id);\nbindShared();\nuiRestore();\nS.offline=navigator.onLine===false;\nif(bootSession()){render();shareReady()}\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

<script>
/* Hub Context Contract v1.
   The one file a child app needs. No dependencies; safe to load in the Hub and in any app.
   Hub side:   HubContract.build(launch, ctx)      -> launch URL carrying the context
               HubContract.parseReturn(hash)       -> what the app said when it came back
   App side:   HubContract.read(location.search)   -> {ok, ctx, errors}
               HubContract.backUrl(ctx, info)      -> where "Back to Hub" goes
               HubContract.notifyHub(ctx, note)    -> put a line under the Hub bell
               HubContract.signedOut(userId)       -> true once the Hub signed the user out */
(function(root){
 const VERSION=1;
 const FIELDS=['app','companyId','company','propertyId','propertyKey','property','role','userId','user','theme','locale','dateFormat','timeZone','returnUrl'];
 const REQUIRED=['app','companyId','role','userId','returnUrl'];
 const RETURN_MARK='#hub-return=';
 const CHANNEL='ea-store';

 /* Only ever go back to a page on this origin: no open redirects, no script URLs. */
 function safeUrl(u,base,hubOrigins){
  try{
   const here=new URL(base||root.location.href),x=new URL(String(u),here);
   if(!/^(https?|file):$/.test(x.protocol))return null;
   if(x.protocol===here.protocol&&x.host===here.host)return x.href;
   /* An app on another site lists the Hub origins it trusts, e.g. ['https://hub.example.com']. */
   return x.protocol==='https:'&&Array.isArray(hubOrigins)&&hubOrigins.indexOf(x.origin)>=0?x.href:null;
  }catch(e){return null}
 }

 function build(launch,ctx,base){
  const u=new URL(launch.url,base||root.location.href);
  u.searchParams.set('hub',String(VERSION));
  (launch.params||FIELDS).forEach(k=>{if(ctx[k]!=null&&ctx[k]!=='')u.searchParams.set(k,String(ctx[k]))});
  return u.href;
 }

 function read(search,opts){
  const o=opts||{},q=new URLSearchParams(search==null?root.location.search:search),ctx={},errors=[];
  if(q.get('hub')!==String(VERSION))errors.push('hub');
  FIELDS.forEach(k=>{const v=q.get(k);if(v!=null&&v!=='')ctx[k]=v});
  REQUIRED.concat(o.require||[]).forEach(k=>{if(!ctx[k])errors.push(k)});
  if(ctx.returnUrl){const s=safeUrl(ctx.returnUrl,o.base,o.hubOrigins);if(s)ctx.returnUrl=s;else{delete ctx.returnUrl;if(errors.indexOf('returnUrl')<0)errors.push('returnUrl')}}
  if(ctx.theme!=='dark'&&ctx.theme!=='light')delete ctx.theme;
  if(o.app&&ctx.app&&ctx.app!==o.app)errors.push('app');
  return {ok:!errors.length,ctx,errors};
 }

 function backUrl(ctx,info,opts){
  const base=ctx&&ctx.returnUrl?safeUrl(ctx.returnUrl,null,opts&&opts.hubOrigins):null;
  if(!base)return null;
  const payload=Object.assign({app:ctx.app},info||{});
  return base.split('#')[0]+RETURN_MARK+encodeURIComponent(JSON.stringify(payload));
 }

 function parseReturn(hash){
  const h=String(hash==null?root.location.hash:hash);
  if(h.indexOf(RETURN_MARK)!==0)return null;
  try{
   const o=JSON.parse(decodeURIComponent(h.slice(RETURN_MARK.length)));
   if(!o||typeof o!=='object'||typeof o.app!=='string')return null;
   return {app:o.app.slice(0,40),event:typeof o.event==='string'?o.event.slice(0,40):'',message:typeof o.message==='string'?o.message.slice(0,200):''};
  }catch(e){return null}
 }

 /* Notes live in the same store the Hub syncs: ea:notes:<topic>:<sender>. */
 function notifyHub(ctx,note){
  if(!ctx||!ctx.userId||!ctx.app||!note||!note.text)return false;
  const key='ea:notes:'+ctx.userId+':app_'+ctx.app,t=Date.now();
  let items=[];
  try{const cur=JSON.parse(root.localStorage.getItem(key)||'null');if(cur&&cur.v===1&&Array.isArray(cur.items))items=cur.items}catch(e){}
  items=[{id:'app_'+ctx.app+'-'+t,type:note.type||'apps',text:String(note.text).slice(0,200),app:ctx.app}].concat(items).slice(0,20);
  const val={v:1,items,_t:t};
  try{root.localStorage.setItem(key,JSON.stringify(val))}catch(e){return false}
  try{const ch=new BroadcastChannel(CHANNEL);ch.postMessage({from:'app',key,val});ch.close()}catch(e){}
  return true;
 }

 function sessionKey(userId){return 'ea-session:'+userId}
 function signedOut(userId){
  try{const o=JSON.parse(root.localStorage.getItem(sessionKey(userId))||'null');return !!(o&&o.out&&(!o.in||o.out>o.in))}catch(e){return false}
 }
 function markSession(userId,what){
  try{const k=sessionKey(userId),o=JSON.parse(root.localStorage.getItem(k)||'null')||{};o[what]=Date.now();root.localStorage.setItem(k,JSON.stringify(o))}catch(e){}
 }

 const PAGES=['index','client','staff','admin'];
 function go(page,hash){
  if(PAGES.indexOf(page)<0)return;
  if(root.EA_FRAMED&&root.parent!==root){root.parent.postMessage({eaNav:page,hash:hash||''},'*');return}
  root.location.assign(page+'.html'+(hash?'#'+hash:''));
 }
 root.HubContract={go,PAGES,VERSION,FIELDS,REQUIRED,build,read,backUrl,parseReturn,notifyHub,safeUrl,sessionKey,signedOut,markSession};
})(window);
</script>
<script>
/* App Registry: the single place an EasySpot app is declared.
   The Hub draws tiles, decides what a tap does and builds the launch URL from this table.

const APP_REGISTRY=[
 {id:'ops',slug:'ops',name:'EasySpotOps',shortName:'Ops',category:'Operations',icon:'square-parking',color:'#2B55F2',
  description:'Keep parking fair: permits, guest passes and entries in one place.',
  keywords:'parking permits guest passes entries tow spots',
  highlights:['Guest passes and permits','Entries and open spots','Tow requests'],
  lifecycle:'live',
  /* The real product, one entrance per kind of person: account admins go to client., EasySpot's own admins to admin., everyone else to staff.
     It refuses to be framed (X-Frame-Options: DENY), so it opens in its own tab.
     Sample of the receiving side: apps/ops.html. */
  launch:{type:'url',url:'https://staff.easyspotops.com/',urlByRole:{account_admin:'https://client.easyspotops.com/',internal_admin:'https://admin.easyspotops.com/'},target:'blank',params:['app','companyId','propertyId','role','userId','theme','locale','returnUrl']},
  requiresSingleProperty:true,allowedRoles:null},
 {id:'home',slug:'home',name:'EasySpotHome',shortName:'Home',category:'Residents',icon:'house',color:'#0F766E',
  description:'Handle building requests faster and make every move-in smooth.',
  keywords:'requests move-in residents maintenance tickets',
  highlights:['Building requests','Move-in checklists','Resident messages'],
  lifecycle:'coming_soon',
  launch:{type:'modal_preview'},
  requiresSingleProperty:true,allowedRoles:null},
 {id:'evt',slug:'events',name:'EasySpotEvents',shortName:'Events',category:'Community',icon:'calendar-heart',color:'#DB2777',
  description:'Bring the community together: plan events and see who is coming.',
  keywords:'events community rsvp calendar gatherings',
  highlights:['Event calendar','RSVPs','Reminders'],
  lifecycle:'coming_soon',
  launch:{type:'modal_preview'},
  requiresSingleProperty:false,allowedRoles:null},
 {id:'fin',slug:'finance',name:'EasySpotFinance',shortName:'Finance',category:'Finance',icon:'landmark',color:'#7C3AED',
  description:'See charges and deposits clearly, without spreadsheets.',
  keywords:'charges deposits payments invoices money',
  highlights:['Charges and deposits','Monthly statements','Exports'],
  lifecycle:'coming_soon',
  launch:{type:'modal_preview'},
  requiresSingleProperty:false,allowedRoles:['account_admin','property_manager']}
];
const APP_KEYS=APP_REGISTRY.map(a=>a.id);
const appDef=id=>APP_REGISTRY.find(a=>a.id===id);
/* Short aliases the role pages already use. */
const APPS=APP_REGISTRY.map(a=>({k:a.id,name:a.name,icon:a.icon,desc:a.description}));
const A=k=>APPS.find(a=>a.k===k);

/* One vocabulary for every view. */
const LIFECYCLES=['live','beta','coming_soon','maintenance'];
const LIFECYCLE={
 live:{label:'Live'},
 beta:{label:'Beta',chip:'c-new',icon:'sparkles'},
 coming_soon:{label:'Coming soon',chip:'c-pending',icon:'clock'},
 maintenance:{label:'Maintenance',chip:'c-pending',icon:'triangle-alert'}};
const APP_STATES=['open','new','pending','available','request_access','locked'];
const APP_STATE={
 open:{label:'Ready to open',icon:'circle-check'},
 new:{label:'New',icon:'sparkles'},
 pending:{label:'Pending approval',icon:'clock'},
 available:{label:'Add to your Hub',icon:'plus'},
 request_access:{label:'No access yet',icon:'key-round'},
 locked:{label:'Not available',icon:'lock'}};
const REQ_STATES=['pending','approved','denied','expired'];
const REQ_STATE={
 pending:{chip:'c-pending',icon:'clock',label:'Pending approval',event:'pending'},
 approved:{chip:'c-open',icon:'circle-check',label:'Approved',event:'approved'},
 denied:{chip:'c-locked',icon:'circle-x',label:'Not approved',event:'not_approved'},
 expired:{chip:'c-locked',icon:'clock',label:'Expired',event:'expired'}};

/* System-wide config, owned by EasySpot (admin console). */
const SYS_KEY='ea:sys:config';
const SYS_DEFAULT=()=>({v:1,lifecycle:{},enableTtlDays:14});
function sysConfig(){
 const o=typeof storeGet==='function'?storeGet(SYS_KEY):null,d=SYS_DEFAULT();
 if(!o||o.v!==1)return d;
 if(o.lifecycle&&typeof o.lifecycle==='object')APP_KEYS.forEach(k=>{if(lifecycleChoices(k).includes(o.lifecycle[k]))d.lifecycle[k]=o.lifecycle[k]});
 if([7,14,30].includes(o.enableTtlDays))d.enableTtlDays=o.enableTtlDays;
 return d;
}
/* An app with no destination yet can't be switched to live or beta. */
function lifecycleChoices(id){const a=appDef(id);return a&&a.launch&&a.launch.type!=='modal_preview'?LIFECYCLES.slice():['coming_soon','maintenance']}
/* Where this person's tap lands: the entrance for their role if the app has one, else the default. */
function launchFor(app,userRole){const l=app.launch,u=l.urlByRole&&l.urlByRole[userRole];return u?Object.assign({},l,{url:u}):l}
function appLifecycle(id){const a=appDef(id);if(!a)return 'coming_soon';return sysConfig().lifecycle[id]||a.lifecycle}

/* The one answer to "what can this person do with this app, here, now?"
   c = {role:'client'|'staff', userRole, catalog, ent, grants, reqs, enableReqs, prop, now, viewer} */
function resolveAppState(id,c){
 const app=appDef(id),lc=appLifecycle(id);
 const out=(state,reason,extra)=>{const ready=state==='open'||state==='new';return Object.assign({app:id,state,reason:reason||null,lifecycle:lc,ready,launchable:ready&&(lc==='live'||lc==='beta')},extra||{})};
 const newest=(a,b)=>String(b.id).localeCompare(String(a.id));
 if(!app)return out('locked','unknown');
 if(!(c.catalog&&c.catalog[id])){
  if(c.role==='client'){
   const r=(c.enableReqs||[]).filter(x=>x.app===id).sort(newest)[0],vs=r?reqViewSt(r):null;
   if(vs==='pending')return out('pending','easyspot_review',{req:r});
   if(vs==='denied')return out('locked','easyspot_denied',{req:r});
  }
  return out('locked','not_enabled');
 }
 const e=(c.ent&&c.ent[id])||{st:'none'};
 if(c.role==='client'){
  if(e.st==='active')return out(c.now-e.on<7?'new':'open',null,{since:e.on});
  if(e.st==='pending')return out('pending','company_pending',{ent:e});
  return out('available','not_added');
 }
 if(e.st!=='active')return out('locked','not_on_account');
 if(app.allowedRoles&&c.userRole&&!app.allowedRoles.includes(c.userRole))return out('locked','role_not_allowed');
 const g=(c.grants||[]).find(x=>x.app===id&&x.prop===c.prop);
 if(g)return out(c.now-g.on<7?'new':'open',null,{since:g.on});
 const r=(c.reqs||[]).filter(x=>x.app===id&&x.prop===c.prop).sort(newest)[0],vs=r&&r.st!=='approved'?reqViewSt(r):null;
 if(vs==='pending')return out('pending','request_pending',{req:r});
 return out('request_access',c.viewer?'viewer':vs==='denied'?'request_denied':vs==='expired'?'request_expired':'no_grant',{req:vs?r:null});

<script>
/* Settings: one stored object per person, read by the Hub and applied the moment it changes.
   Personal settings  -> localStorage "ea-settings:<userId>" (this device)
   Theme              -> localStorage "ea-web-theme" (light | dark | system), read before first paint
   Organization/System-> the role page owns them (settingsOrgHTML / settingsOrgChange hooks) */
const THEME_KEY='ea-web-theme';
const DATE_FORMATS=[['mdy','Nov 14'],['dmy','14 Nov'],['iso','2026-11-14']];
const TIME_ZONES=[['auto','Automatic (this device)'],['UTC','UTC'],['America/New_York','New York'],['America/Chicago','Chicago'],['America/Los_Angeles','Los Angeles'],['Europe/London','London'],['Asia/Ho_Chi_Minh','Ho Chi Minh City']];
const HUB_VIEWS=[['all','All apps'],['ready','Ready'],['pending','Pending']];
const SESSION_MINUTES=[[15,'15 minutes'],[30,'30 minutes'],[60,'1 hour'],[0,'Never']];
const NOTIF_TYPES=[
 ['req','Access requests','When someone asks for an app, or a request you sent changes'],
 ['appr','Approvals','When an app or request is approved or not'],
 ['apps','App updates','When an app is turned on or off, or its status changes'],
 ['digest','Weekly summary','A short recap every Monday']];
const SETTINGS_SECTIONS=[['appearance','Appearance and defaults','theme dark light density compact default view building'],['region','Language and region','language date format time zone'],['notifications','Notifications','bell email alerts'],['security','Security and session','sign out session timeout'],['org','Organization and system','buildings policy requests availability']];
const SETTINGS_DEFAULT=()=>({v:1,density:'comfortable',defaultView:'all',defaultProp:'last',lastProp:null,lang:'en',dateFormat:'mdy',timeZone:'auto',
 notif:{inapp:{req:true,appr:true,apps:true,digest:false},email:{req:false,appr:false,apps:false,digest:false}},
 sessionMin:30,pins:[],recent:[],notifyReady:{}});
let SETTINGS=SETTINGS_DEFAULT();
let settingsOwner='';
let sessionStart=Date.now(),lastActivity=Date.now();

function settingsKey(){return 'ea-settings:'+settingsOwner}
function settingsClean(o){
 const d=SETTINGS_DEFAULT();
 if(!o||typeof o!=='object'||o.v!==1)return d;
 const pick=(k,list)=>{if(list.includes(o[k]))d[k]=o[k]};
 pick('density',['comfortable','compact']);pick('defaultView',HUB_VIEWS.map(x=>x[0]));pick('lang',['en']);
 pick('dateFormat',DATE_FORMATS.map(x=>x[0]));pick('timeZone',TIME_ZONES.map(x=>x[0]));pick('sessionMin',SESSION_MINUTES.map(x=>x[0]));
 if(typeof o.defaultProp==='string'&&/^[a-z0-9]{1,12}$/.test(o.defaultProp))d.defaultProp=o.defaultProp;
 if(typeof o.lastProp==='string'&&/^[a-z0-9]{1,12}$/.test(o.lastProp))d.lastProp=o.lastProp;
 ['inapp','email'].forEach(ch=>NOTIF_TYPES.forEach(([k])=>{if(o.notif&&o.notif[ch]&&typeof o.notif[ch][k]==='boolean')d.notif[ch][k]=o.notif[ch][k]}));
 const ids=a=>Array.isArray(a)?a.filter((k,i)=>APP_KEYS.includes(k)&&a.indexOf(k)===i):[];
 d.pins=ids(o.pins);d.recent=ids(o.recent).slice(0,4);
 if(o.notifyReady&&typeof o.notifyReady==='object')APP_KEYS.forEach(k=>{if(o.notifyReady[k]===true)d.notifyReady[k]=true});
 return d;
}
function settingsLoad(){let o=null;try{o=JSON.parse(localStorage.getItem(settingsKey())||'null')}catch(e){}SETTINGS=settingsClean(o)}
function settingsSave(patch,quiet){
 Object.assign(SETTINGS,patch||{});
 try{localStorage.setItem(settingsKey(),JSON.stringify(SETTINGS))}catch(e){}
 settingsApply();
 if(!quiet){settingsSaved=true;if(typeof render==='function')render();live('Saved.')}
}
let settingsSaved=false;
function settingsApply(){document.documentElement.classList.toggle('dens-compact',SETTINGS.density==='compact')}

function sysDark(){return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function readThemeMode(){let t=null;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem(THEME_KEY)}catch(e){}return t==='dark'||t==='light'?t:'system'}

/* Dates in this preview are sample days counted from a fixed base, so they are formatted in UTC. */
function fmtDate(dt){
 const f=SETTINGS.dateFormat;
 if(f==='iso')return dt.toISOString().slice(0,10);
 return dt.toLocaleDateString(f==='dmy'?'en-GB':'en-US',{month:'short',day:'numeric',timeZone:'UTC'});
}
function fmtTime(ts){
 const o={hour:'numeric',minute:'2-digit',timeZoneName:'short'};
 if(SETTINGS.timeZone!=='auto')o.timeZone=SETTINGS.timeZone;
 try{return new Date(ts).toLocaleTimeString(SETTINGS.dateFormat==='mdy'?'en-US':'en-GB',o)}catch(e){return new Date(ts).toLocaleTimeString()}
}

function togglePin(k){const on=SETTINGS.pins.includes(k);settingsSave({pins:on?SETTINGS.pins.filter(x=>x!==k):SETTINGS.pins.concat(k)},true);return !on}
function pushRecent(k){settingsSave({recent:[k].concat(SETTINGS.recent.filter(x=>x!==k)).slice(0,4)},true)}
function notifOn(type){const n=SETTINGS.notif.inapp;return n[type]!==false}

function settingsInit(userId){
 settingsOwner=userId;settingsLoad();settingsApply();
 try{const k='ea-session-start:'+userId,v=+sessionStorage.getItem(k);if(v)sessionStart=v;else sessionStorage.setItem(k,String(sessionStart))}catch(e){}
 ['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{lastActivity=Date.now()},true));
 setInterval(sessionTick,5000);
 if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(themeMode==='system'){setTheme('system');render()}});
 addEventListener('storage',e=>{if(e.key===settingsKey()){settingsLoad();settingsApply();render()}if(e.key===HubContract.sessionKey(settingsOwner)&&HubContract.signedOut(settingsOwner)&&S.session==='ok'){closeAll();S.session='out';render()}});
}
function sessionTick(now){
 if(S.session!=='ok'||!SETTINGS.sessionMin)return;
 if((now||Date.now())-lastActivity<SETTINGS.sessionMin*6e4)return;
 closeAll();S.session='expired';render();const b=$('#signIn');b&&b.focus();
}

function settingsView(back){
 const s=SETTINGS,hub=typeof hubView==='function';
 const head=(k,t)=>`<h2 class="h3" id="set-${k}" tabindex="-1">${t}</h2>`;
 const seg=(key,label,opts,cur)=>`<div class="set-row"><span class="set-l" id="setl-${key}">${label}</span><div class="seg" role="radiogroup" aria-labelledby="setl-${key}">${opts.map(([v,l])=>`<button type="button" role="radio" data-k="set-${key}-${v}" data-setseg="${key}|${v}" aria-checked="${cur===v}" tabindex="${cur===v?0:-1}">${l}</button>`).join('')}</div></div>`;
 const sel=(key,label,opts,cur,help)=>`<div class="field"><label for="set-f-${key}">${label}</label><select id="set-f-${key}" data-k="set-${key}" data-set="${key}"${help?` aria-describedby="set-h-${key}"`:''}>${opts.map(([v,l,off])=>`<option value="${esc(v)}"${String(cur)===String(v)?' selected':''}${off?' disabled':''}>${esc(l)}</option>`).join('')}</select>${help?`<span class="help" id="set-h-${key}">${help}</span>`:''}</div>`;
 const propOpts=hub?[['last','Last used']].concat(hubPropChoices()):[];
 const u=me();
 const org=typeof settingsOrgHTML==='function'?settingsOrgHTML(head):'';
 return `<div id="settingsView" class="page-narrow">${back||(typeof backBtn==='function'?backBtn():'')}<h1 style="margin-top:12px">Settings</h1>${pageCoSub()}
 <p class="muted set-status" id="setStatus" role="status">${ic(settingsSaved?'circle-check':'info',15)}<span>${settingsSaved?'All changes saved on this device.':'Changes save as you make them. Nothing is sent.'}</span> <span class="sample">Preview</span></p>
 <div class="card">${head('appearance','Appearance and defaults')}
  ${seg('theme','Theme',[['light','Light'],['dark','Dark'],['system','System']],themeMode)}
  ${seg('density','App tiles',[['comfortable','Comfortable'],['compact','Compact']],s.density)}
  ${hub?sel('defaultView','Show first when the Hub opens',HUB_VIEWS,s.defaultView)+sel('defaultProp','Building when you sign in',propOpts,propOpts.some(o=>o[0]===s.defaultProp)?s.defaultProp:'last'):''}</div>
 <div class="card">${head('region','Language and region')}
  ${sel('lang','Display language',[['en','English'],['vi','Tiếng Việt (coming soon)',1],['es','Español (coming soon)',1]],s.lang,'Only English is available in this preview.')}
  ${sel('dateFormat','Date format',DATE_FORMATS,s.dateFormat)}
  ${sel('timeZone','Time zone',TIME_ZONES,s.timeZone,`Now: ${esc(fmtTime(Date.now()))}`)}</div>
 <div class="card">${head('notifications','Notifications')}<p class="small muted" style="margin:4px 0 8px">In app shows under the bell. Email is a preview: nothing is sent.</p>
  <div class="list">${NOTIF_TYPES.map(([k,l,h])=>`<div class="li set-n"><div class="grow"><b style="font-weight:600">${l}</b><span class="small muted" style="display:block">${h}</span></div><div class="set-n-sw">${[['inapp','In app'],['email','Email']].map(([ch,cl])=>`<button type="button" class="sw" role="switch" data-k="ns-${ch}-${k}" data-setsw="${ch}|${k}" aria-checked="${!!s.notif[ch][k]}" aria-label="${l}: ${cl}"><span class="trk"></span><span aria-hidden="true">${cl}</span></button>`).join('')}</div></div>`).join('')}</div></div>
 <div class="card">${head('security','Security and session')}
  <div class="list" style="margin-top:6px"><div class="li"><span class="muted pf-k">Signed in as</span><span class="pf-v" style="overflow-wrap:anywhere">${esc(u.email||u.name)}</span></div><div class="li"><span class="muted pf-k">This session</span><span class="pf-v">Started ${esc(fmtTime(sessionStart))}</span></div></div>
  ${sel('sessionMin','Sign me out when idle for',SESSION_MINUTES,s.sessionMin,'Applies to this Hub on this device.')}
  <div style="margin-top:14px"><button type="button" class="btn btn-outline" id="setSignoutAll" data-k="set-signout-all">${ic('log-out',16)}Sign out of every EasySpot app</button></div></div>
 ${org}
 <div style="margin-top:16px"><button type="button" class="btn btn-outline" id="setReset" data-k="set-reset">${ic('refresh-cw',16)}Reset my settings</button></div></div>`;
}

function settingsClick(t){
 if(t.dataset.setseg){
  const [key,val]=t.dataset.setseg.split('|');
  if(key==='theme'){if(!['light','dark','system'].includes(val))return true;setTheme(val);settingsSaved=true;render();live(val==='system'?'Theme follows this device.':val==='dark'?'Dark mode on.':'Light mode on.')}
  else if(key==='density'&&['comfortable','compact'].includes(val))settingsSave({density:val});
  const b=document.querySelector(`[data-k="set-${key}-${val}"]`);b&&b.focus();return true}
 if(t.dataset.setsw){const [ch,k]=t.dataset.setsw.split('|');if(!SETTINGS.notif[ch]||!(k in SETTINGS.notif[ch]))return true;SETTINGS.notif[ch][k]=!SETTINGS.notif[ch][k];settingsSave();return true}
 if(t.id==='setSignoutAll'){signOut();return true}
 if(t.id==='setReset'){
  const m=openModal('resetModal',`<h2 id="resetModal-t">Reset your settings?</h2><p class="lead">Theme, tiles, defaults, notifications and pinned apps go back to how they started. Your access to apps does not change.</p><div class="acts-col"><button type="button" class="btn btn-primary btn-block" id="rsYes">Reset my settings</button><button type="button" class="btn btn-outline btn-block" data-close>Cancel</button></div>`,{opener:t,focus:'[data-close]'});
  m.querySelector('#rsYes').onclick=()=>{SETTINGS=SETTINGS_DEFAULT();setTheme('system');closeModal({noReturn:true});settingsSave();live('Settings reset.');const b=$('#setReset');b&&b.focus()};
  return true}
 return false;
}
document.addEventListener('change',e=>{
 const t=e.target;if(!t||!t.dataset)return;
 if(t.dataset.set){
  const key=t.dataset.set,v=t.value,lists={defaultView:HUB_VIEWS,dateFormat:DATE_FORMATS,timeZone:TIME_ZONES};
  if(key==='sessionMin'){if(SESSION_MINUTES.some(x=>String(x[0])===v))settingsSave({sessionMin:+v})}
  else if(key==='defaultProp'){if(v==='last'||hubPropChoices().some(x=>x[0]===v))settingsSave({defaultProp:v})}
  else if(key==='lang'){if(v==='en')settingsSave({lang:v})}
  else if(lists[key]&&lists[key].some(x=>x[0]===v))settingsSave({[key]:v});
  return}
 if(t.dataset.setorg&&typeof settingsOrgChange==='function'){settingsOrgChange(t.dataset.setorg,t.value,t);return}
});
function openSettingsSection(key){go('settings');const h=$('#set-'+key);if(h){h.scrollIntoView({block:'start'});h.focus({preventScroll:true})}}
</script>

   A page reads the topics it belongs to (NOTE_TOPICS) and writes one outbox per topic it talks to. */
function noteFrom(){return storeRole()}

function notify(topic,type,text,extra){
 const key='ea:notes:'+topic+':'+noteFrom(),cur=storeGet(key);
 const items=cur&&cur.v===1&&Array.isArray(cur.items)?cur.items.slice():[];
 items.unshift(Object.assign({id:noteFrom()+'-'+storeNow(),type,text:String(text),day:S.now},extra||{}));
 storeSet(key,{v:1,items:items.slice(0,30)});
}

  const k=localStorage.key(i);if(!k||k.indexOf('ea:notes:')!==0)continue;

<script>
/* Sign-in for the preview. One door for everyone: the account decides which workspace opens.
   This is a design mock: the accounts below live in the page, there is no server and no password is stored.
   A real build replaces authenticate() with a call to the identity service. */
const EaAuth=(function(){
 const ACCOUNTS=[
  {username:'client',email:'daniel.okafor@amcllc.sample',password:'1234',userId:'u_001',name:'Daniel Okafor',role:'Account admin',company:'AMC LLC',page:'client'},
  {username:'staff',email:'maria.lopez@amcllc.sample',password:'1234',userId:'u_002',name:'Maria Lopez',role:'Property manager',company:'AMC LLC',page:'staff'},
  {username:'admin',email:'priya.shah@easyspot.sample',password:'1234',userId:'u_010',name:'Priya Shah',role:'Internal admin',company:'EasySpot',page:'admin'}];
 const SIGNUPS='ea-auth-signups',LAST='ea-auth-last',REMEMBER='ea-auth-remember',TRIES='ea-auth-tries';
 const MAX_TRIES=5,LOCK_MS=30000;
 const get=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}};
 const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
 const norm=s=>String(s||'').trim().toLowerCase();
 const find=id=>ACCOUNTS.find(a=>a.username===norm(id)||a.email===norm(id));
 const signups=()=>{const a=get(SIGNUPS,[]);return Array.isArray(a)?a.filter(x=>x&&typeof x.email==='string'):[]};
 const pending=id=>signups().find(x=>x.email===norm(id));
 function lockedFor(){const t=get(TRIES,{n:0,until:0});return Math.max(0,Math.ceil(((t.until||0)-Date.now())/1000))}
 /* -> {ok:true, account} | {ok:false, reason:'locked'|'unverified'|'invalid', seconds?, email?} */
 function authenticate(id,password){
  const wait=lockedFor();if(wait)return {ok:false,reason:'locked',seconds:wait};
  const a=find(id);
  if(a&&String(password)===a.password){set(TRIES,{n:0,until:0});return {ok:true,account:a}}
  const p=pending(id);if(p)return {ok:false,reason:'unverified',email:p.email};
  const t=get(TRIES,{n:0,until:0}),n=(t.n||0)+1;
  if(n>=MAX_TRIES){set(TRIES,{n:0,until:Date.now()+LOCK_MS});return {ok:false,reason:'locked',seconds:LOCK_MS/1000}}
  set(TRIES,{n,until:0});return {ok:false,reason:'invalid',left:MAX_TRIES-n};
 }
 function start(account,remember){HubContract.markSession(account.userId,'in');set(LAST,account.username);if(remember)set(REMEMBER,account.username);else{try{localStorage.removeItem(REMEMBER)}catch(e){}}}
 /* The account this browser last used, if it is still signed in. */
 function current(){const a=find(get(LAST,''));if(!a)return null;let rec=null;try{rec=localStorage.getItem(HubContract.sessionKey(a.userId))}catch(e){}return rec&&!HubContract.signedOut(a.userId)?a:null}
 function register(d){
  const email=norm(d.email);
  if(find(email)||pending(email))return {ok:false,reason:'exists'};
  set(SIGNUPS,signups().concat({name:String(d.name).trim().slice(0,80),email,company:String(d.company).trim().slice(0,80),size:String(d.size).slice(0,12),at:Date.now()}).slice(-20));
  return {ok:true,email};
 }
 /* 0-4, plus what is still missing. */
 function strength(p){p=String(p||'');const miss=[];if(p.length<8)miss.push('8 characters');if(!/[0-9]/.test(p))miss.push('a number');if(!/[a-z]/i.test(p))miss.push('a letter');let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[0-9]/.test(p)&&/[a-z]/i.test(p))s++;if(/[^a-z0-9]/i.test(p)||(/[a-z]/.test(p)&&/[A-Z]/.test(p)))s++;return {score:p?Math.max(1,s):0,miss}}
 return {authenticate,start,current,register,strength,lockedFor,remembered:()=>get(REMEMBER,''),ACCOUNTS_COUNT:ACCOUNTS.length};
})();
</script>

function setErr(id,msg){const i=$('#'+id),e=$('#'+id+'Err');if(!e)return;if(msg){e.hidden=false;e.innerHTML=`${ic('circle-alert',15)}<span>${msg}</span>`;if(i&&i.type!=='checkbox'){i.classList.add('is-err');i.setAttribute('aria-invalid','true')}}else{e.hidden=true;e.innerHTML='';if(i){i.classList.remove('is-err');i.removeAttribute('aria-invalid')}}}
function formErr(msg){const e=$('#formErr');if(!e)return;e.hidden=!msg;e.innerHTML=msg?`${ic('circle-alert',16)}<span>${msg}</span>`:''}
function setBusy(btn,on,label){busy=on;btn.disabled=on;if(on){btn.dataset.l=btn.textContent;btn.setAttribute('aria-busy','true');btn.innerHTML=`${ic('refresh-cw',16)}${label}`}else{btn.removeAttribute('aria-busy');btn.textContent=btn.dataset.l||btn.textContent}}
function lockWatch(){
 clearInterval(lockTimer);
 const tick=()=>{const s=EaAuth.lockedFor(),b=$('#loginBtn');if(!b||view!=='login'){clearInterval(lockTimer);return}if(s){b.disabled=true;formErr(`Too many attempts. Try again in ${s} second${s===1?'':'s'}.`)}else{if(!busy)b.disabled=false;if(lockTimer){formErr('');clearInterval(lockTimer);lockTimer=null}}};
 if(EaAuth.lockedFor()){tick();lockTimer=setInterval(tick,1000)}
}
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

document.addEventListener('submit',e=>{
 e.preventDefault();if(busy)return;
 const f=e.target.id;
 if(f==='loginForm'){
  const user=$('#user').value.trim(),pass=$('#pass').value;formErr('');setErr('user','');setErr('pass','');
  if(!user){setErr('user','Enter your username or email.');$('#user').focus();return}
  if(!pass){setErr('pass','Enter your password.');$('#pass').focus();return}
  const btn=$('#loginBtn');setBusy(btn,true,'Logging in…');
  setTimeout(()=>{
   const r=EaAuth.authenticate(user,pass);
   if(r.ok){EaAuth.start(r.account,$('#remember').checked);HubContract.go(r.account.page);return}
   setBusy(btn,false);
   if(r.reason==='locked'){lockWatch();return}
   if(r.reason==='unverified'){formErr(`Verify your email to finish setting up. We sent a link to ${esc(r.email)}.`);return}
   formErr(`That username or password isn't right.${r.left<=2?` ${r.left} attempt${r.left===1?'':'s'} left.`:''}`);
   const p=$('#pass');p.value='';p.classList.add('is-err');p.setAttribute('aria-invalid','true');p.focus();
  },550);
  return}
 if(f==='signupForm'){
  const v={name:$('#name').value.trim(),email:$('#email').value.trim(),company:$('#company').value.trim(),size:$('#size').value,pass:$('#newpass').value};
  const bad={name:v.name.length<2?'Enter your full name.':'',email:!EMAIL.test(v.email)?'Enter a full email address, like name@company.com.':'',company:v.company.length<2?'Enter your company name.':'',newpass:EaAuth.strength(v.pass).miss.length?'Your password still needs '+EaAuth.strength(v.pass).miss.join(' and ')+'.':'',terms:$('#terms').checked?'':'Please agree to the terms to continue.'};
  let first=null;Object.keys(bad).forEach(k=>{setErr(k,bad[k]);if(bad[k]&&!first)first=k});
  if(first){$('#'+first).focus();return}
  const btn=$('#signupBtn');setBusy(btn,true,'Creating your account…');
  setTimeout(()=>{const r=EaAuth.register(v);setBusy(btn,false);
   if(!r.ok){setErr('email','An account with this email already exists. Log in instead.');$('#email').focus();return}
   memo={email:r.email};nav('verify')},650);
  return}
 if(f==='forgotForm'){
  const u=$('#fuser').value.trim();setErr('fuser','');
  if(!u){setErr('fuser','Enter your username or email.');$('#fuser').focus();return}
  const btn=$('#forgotBtn');setBusy(btn,true,'Sending…');
  setTimeout(()=>{setBusy(btn,false);memo={email:u};nav('sent')},550);
 }
});
document.addEventListener('click',e=>{
 const home=e.target.closest('[data-home]');if(home){e.preventDefault();nav('');return}
 const t=e.target.closest('button');if(!t)return;
 if(t.id==='themeBtn'){setTheme(theme==='dark'?'light':'dark');const keep={};document.querySelectorAll('#app input:not([type=password]),#app select').forEach(i=>{keep[i.id]=i.type==='checkbox'?i.checked:i.value});render();Object.keys(keep).forEach(k=>{const i=$('#'+k);if(i){if(i.type==='checkbox')i.checked=keep[k];else i.value=keep[k]}});$('#themeBtn').focus();return}
 if(t.id==='openWs'){const a=EaAuth.current();if(a)HubContract.go(a.page);else nav('login');return}
 if(t.dataset.eye){const i=$('#'+t.dataset.eye),show=i.type==='password';i.type=show?'text':'password';t.setAttribute('aria-pressed',show);t.setAttribute('aria-label',show?'Hide password':'Show password');t.innerHTML=ic(show?'eye-off':'eye',18);i.focus();return}
 if(t.id==='resend'){t.disabled=true;live('Sent again. Give it a minute.');setTimeout(()=>{t.disabled=false},8000);return}
});
document.addEventListener('input',e=>{
 const t=e.target;if(!t.id)return;
 if($('#'+t.id+'Err')&&!$('#'+t.id+'Err').hidden)setErr(t.id,'');
 if(t.id==='newpass'){const s=EaAuth.strength(t.value);$('#pwMeter').dataset.score=s.score;$('#pwLabel').textContent=t.value?['','Weak','Fair','Good','Strong'][s.score]+(s.miss.length?' · needs '+s.miss.join(' and '):''):''}
});
document.addEventListener('change',e=>{if(e.target.id==='terms'&&e.target.checked)setErr('terms','')});
document.addEventListener('keyup',e=>{const c=$('#capsNote');if(c&&e.target.type==='password'&&e.getModifierState)c.hidden=!e.getModifierState('CapsLock')});
addEventListener('hashchange',()=>{render();focusFirst()});

/* Single-file build: the three workspaces travel inside this page and open in a frame over it. */
function mountPage(page){
 const src=document.getElementById('ea-page-'+page);if(!src)return false;
 let f=$('#eaFrame');if(!f){f=document.createElement('iframe');f.id='eaFrame';f.className='ea-frame';document.body.appendChild(f)}
 f.title=({client:'Hub',staff:'Hub',admin:'Admin console'})[page];
 f.srcdoc=JSON.parse(src.textContent).replace('<'+'head>','<'+'head><script>window.EA_FRAMED=true;window.EA_STANDALONE=true<\/script>');
 $('#app').hidden=true;document.querySelector('.skip').hidden=true;return true;
}
function unmountPage(){const f=$('#eaFrame');if(f)f.remove();$('#app').hidden=false;document.querySelector('.skip').hidden=false}
if(window.EA_BUNDLE){
 HubContract.go=(page,hash)=>{if(page==='index'){unmountPage();nav(hash||'')}else if(HubContract.PAGES.includes(page))mountPage(page)};
 addEventListener('message',e=>{const f=$('#eaFrame'),d=e.data;if(!f||e.source!==f.contentWindow||!d||typeof d.eaNav!=='string'||!HubContract.PAGES.includes(d.eaNav))return;HubContract.go(d.eaNav,VIEWS.includes(d.hash)?d.hash:'')});
}
render();
if(view!=='')focusFirst();
</script>
</body>
</html>
